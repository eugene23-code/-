<!doctype html>
<meta charset="utf-8">
<title>귀띔 고객 화면</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 왼쪽: 시나리오·단계 설명 패널 / 오른쪽: 실제로 눌러보는 고객 폰 */
:root {
  --brand: #D8201F;
  --brand-tint: #FDECEC;
  --bg: #F2F4F6;
  --surface: #FFFFFF;
  --surface2: #F7F8FA;
  --fg: #191F28;
  --fg2: #4E5968;
  --fg3: #8B95A1;
  --line: #E5E8EB;
  --green: #14A36B;
  --green-tint: #E3F6EE;
  --kakao: #FEE500;
  --kakao-fg: #191919;
  --chat-bg: #BACEE0;
  --frame: #191F28;
  --font: 'Pretendard', 'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #FF4D4A; --brand-tint: #3A1C1E;
    --bg: #101317; --surface: #1F242B; --surface2: #262C34;
    --fg: #F2F4F6; --fg2: #B0B8C1; --fg3: #7E8894; --line: #2F363E;
    --green: #2FC48A; --green-tint: #173328;
    --chat-bg: #2A3440; --frame: #000000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #FF4D4A; --brand-tint: #3A1C1E;
  --bg: #101317; --surface: #1F242B; --surface2: #262C34;
  --fg: #F2F4F6; --fg2: #B0B8C1; --fg3: #7E8894; --line: #2F363E;
  --green: #2FC48A; --green-tint: #173328;
  --chat-bg: #2A3440; --frame: #000000;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.55; letter-spacing: -0.02em; word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; letter-spacing: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

.page { max-width: 1040px; margin: 0 auto; padding-block: 40px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 56px; align-items: start; }

/* 설명 패널 */
.side { min-width: 0; position: sticky; top: 24px; }
.badge { display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--brand); background: var(--brand-tint); padding: 5px 10px; border-radius: 99px; }
.side h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.25; margin-top: 16px; text-wrap: balance; }
.side .lead { color: var(--fg2); margin-top: 10px; font-size: 16px; }
.tabs { margin-top: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); padding: 6px; border-radius: 16px; }
.tabs button { padding: 12px 8px; border-radius: 12px; font-weight: 700; color: var(--fg3); font-size: 14.5px; }
.tabs button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.steps { list-style: none; margin: 24px 0 0; padding: 0; display: flex; flex-direction: column; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 10px 0; color: var(--fg3); }
.steps li i { width: 28px; height: 28px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); font-style: normal; font-size: 13px; font-weight: 800; display: grid; place-items: center; }
.steps li b { display: block; font-size: 15.5px; }
.steps li span { font-size: 13.5px; }
.steps li.past i { background: var(--fg3); border-color: var(--fg3); color: var(--surface); }
.steps li.now { color: var(--fg); }
.steps li.now i { background: var(--brand); border-color: var(--brand); color: #fff; }
.steps li.now span { color: var(--fg2); }
.behind { margin-top: 18px; background: var(--surface); border-radius: 18px; padding: 18px; }
.behind .l { font-size: 12.5px; font-weight: 700; color: var(--brand); }
.behind p { margin-top: 6px; font-size: 14.5px; color: var(--fg2); }
.reset { margin-top: 14px; font-size: 13.5px; font-weight: 600; color: var(--fg3); text-decoration: underline; text-underline-offset: 3px; }
.disc { margin-top: 22px; font-size: 12.5px; color: var(--fg3); line-height: 1.6; }

/* 폰 */
.phone { width: 390px; max-width: 100%; background: var(--frame); border-radius: 52px; padding: 12px; box-shadow: 0 30px 60px -24px rgba(25,31,40,.4); }
.screen { height: 760px; border-radius: 40px; overflow: hidden; background: var(--surface); display: flex; flex-direction: column; position: relative; }
.status { flex: none; height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font-size: 14px; font-weight: 700; }
.status .isl { width: 100px; height: 28px; border-radius: 20px; background: var(--frame); }
.status .bt { font-size: 11px; letter-spacing: 1px; }
.app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }
.cta { flex: none; padding: 12px 18px 22px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.btn { width: 100%; padding: 16px; border-radius: 16px; font-weight: 700; font-size: 16px; background: var(--brand); color: #fff; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.sub { background: var(--surface2); color: var(--fg2); }
.nav { flex: none; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-weight: 700; font-size: 15px; }
.nav .back { width: 36px; height: 36px; border-radius: 10px; font-size: 22px; line-height: 1; }
.nav .who { font-size: 12px; font-weight: 600; color: var(--fg3); margin-left: auto; }

/* 카카오 채팅 */
.screen.kakao, .screen.kakao .status { background: var(--chat-bg); }
.kakao .nav { background: var(--chat-bg); }
.kakao .scroll { padding: 4px 14px 20px; }
.day { text-align: center; margin: 10px 0 14px; }
.day span { display: inline-block; font-size: 11.5px; padding: 3px 12px; border-radius: 99px; background: rgba(0,0,0,.12); color: var(--fg); }
.msg { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 12px; }
.msg .pf { flex: none; width: 36px; height: 36px; border-radius: 13px; background: var(--brand); color: #fff; font-weight: 800; display: grid; place-items: center; }
.msg .col { min-width: 0; flex: 1; max-width: 270px; }
.msg .nm { font-size: 12px; color: var(--fg2); margin-bottom: 4px; }
.msg .tm { font-size: 10.5px; color: var(--fg2); margin-top: 3px; }
.bubble { background: var(--surface); border-radius: 4px 16px 16px 16px; overflow: hidden; font-size: 13px; line-height: 1.6; animation: pop .35s cubic-bezier(.2,.8,.2,1) both; }
.bubble .kh { background: var(--kakao); color: var(--kakao-fg); font-weight: 700; font-size: 12.5px; padding: 9px 13px; }
.bubble .bd { padding: 13px 13px 4px; }
.bubble .bd b { display: block; font-size: 14.5px; margin-bottom: 6px; }
.bubble .bd p { margin-bottom: 8px; color: var(--fg2); }
.bubble .bd p strong { color: var(--fg); }
.bubble .bd .box { background: var(--surface2); border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 12.5px; color: var(--fg2); }
.bubble .bd .box div { display: flex; justify-content: space-between; gap: 8px; }
.bubble .bd .box div b { display: inline; font-size: 12.5px; margin: 0; color: var(--fg); text-align: right; }
.bubble .acts { display: flex; flex-direction: column; gap: 6px; padding: 4px 13px 13px; }
.bubble .acts button { padding: 10px; border-radius: 8px; background: var(--surface2); font-weight: 700; font-size: 13px; }
.bubble .acts button.hot { background: var(--brand); color: #fff; animation: nudge 1.8s ease-in-out infinite; }
@keyframes pop { from { transform: translateY(10px) scale(.98); } to { transform: none; } }
@keyframes nudge { 0%, 100% { box-shadow: 0 0 0 0 rgba(216,32,31,.35); } 50% { box-shadow: 0 0 0 6px rgba(216,32,31,0); } }

/* 고객 페이지 공통 */
.pad { padding: 8px 22px 24px; }
.eb { font-size: 13.5px; font-weight: 700; color: var(--brand); }
.h { font-size: 24px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.35; margin-top: 6px; }
.big { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin-top: 18px; }
.muted { color: var(--fg3); font-size: 13.5px; }
.card { background: var(--surface2); border-radius: 18px; padding: 16px; margin-top: 16px; }
.card .t { font-size: 13px; font-weight: 700; color: var(--fg3); margin-bottom: 8px; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 6px 0; font-size: 14px; }
.row span { color: var(--fg2); }
.row b { font-variant-numeric: tabular-nums; text-align: right; }
.row b.up { color: var(--brand); }
.bars { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
.bar .lb { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg2); margin-bottom: 5px; }
.bar .lb b { color: var(--fg); font-variant-numeric: tabular-nums; }
.bar .tr { height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar .fl { height: 100%; border-radius: 99px; background: var(--fg3); transition: width .3s; }
.bar.cma .fl { background: var(--brand); }
.bar.cma .lb b { color: var(--brand); }
input[type="range"] { width: 100%; accent-color: var(--brand); margin: 10px 0 2px; }
.rng-cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg3); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; font-size: 14px; }
.list li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; color: var(--fg2); }
.list li::before { content: "•"; color: var(--brand); font-weight: 800; text-align: center; }
.chk { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--line); cursor: pointer; font-size: 14.5px; }
.chk input { width: 22px; height: 22px; accent-color: var(--brand); margin: 1px 0 0; flex: none; }
.chk small { display: block; color: var(--fg3); font-size: 12.5px; margin-top: 2px; }
.flow { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
.flow > div { flex: 1; min-width: 0; background: var(--surface2); border-radius: 16px; padding: 14px; }
.flow .arr { flex: none; color: var(--fg3); font-size: 18px; }
.flow small { display: block; font-size: 12px; color: var(--fg3); }
.flow b { font-size: 14.5px; }
.chip { display: inline-block; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 99px; background: var(--brand-tint); color: var(--brand); }
.appt { background: var(--brand); color: #fff; border-radius: 20px; padding: 18px; margin-top: 16px; }
.appt .chip { background: rgba(255,255,255,.2); color: #fff; }
.appt .when { font-size: 22px; font-weight: 800; margin-top: 10px; letter-spacing: -0.03em; }
.appt .how { font-size: 13.5px; opacity: .85; margin-top: 2px; }
.slots { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.slots button { text-align: left; padding: 15px 16px; border-radius: 14px; background: var(--surface2); font-size: 15px; font-weight: 600; border: 2px solid transparent; }
.slots button small { display: block; color: var(--fg3); font-weight: 500; font-size: 12.5px; }
.slots button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-tint); }
.slots button:disabled { color: var(--fg3); cursor: not-allowed; text-decoration: line-through; }
.okmark { width: 72px; height: 72px; border-radius: 50%; background: var(--green-tint); color: var(--green); font-size: 34px; font-weight: 800; display: grid; place-items: center; margin: 36px auto 0; animation: pop .45s cubic-bezier(.2,.8,.2,1) both; }
.center { text-align: center; }
.spin { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--brand); animation: rot .8s linear infinite; margin: 0 auto; }
@keyframes rot { to { transform: rotate(360deg); } }
.loading { position: absolute; inset: 0; background: color-mix(in srgb, var(--surface) 92%, transparent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-weight: 700; z-index: 5; }
.tiny { font-size: 11.5px; color: var(--fg3); text-align: center; padding: 4px 0 0; }

/* 시연 모드 고객 폰 (?embed&mini · live.js 패널) */
.mini .side { display: none; }
html.mini.embed .page { display: block; max-width: none; padding: 6px; }
.mini .phone { width: 100%; padding: 9px; border-radius: 44px; box-shadow: none; }
.mini .screen { height: max(440px, calc(100vh - 40px)); border-radius: 36px; }
.bubble .bd .ntc { font-size: 10.5px; line-height: 1.5; color: var(--fg3); margin-bottom: 8px; }
.screen.lockscr { background: linear-gradient(160deg, #3A1F2B, #D8201F); color: #fff; }
.screen.lockscr .status { color: #fff; }
.wait { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; text-align: center; }
.wait .wt { font-size: 64px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.wait .wd { font-size: 14px; opacity: .85; margin-top: 8px; }
.wait .wn { margin-top: auto; margin-bottom: 30px; background: rgba(255,255,255,.16); border-radius: 18px; padding: 16px; font-size: 13px; line-height: 1.6; width: 100%; }
.wait .wn b { display: block; font-size: 14.5px; margin-bottom: 2px; }
.banner { position: absolute; top: 50px; left: 10px; right: 10px; z-index: 6; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); border-radius: 18px; padding: 11px 13px; box-shadow: 0 10px 30px rgba(0,0,0,.18); font-size: 12.5px; color: var(--fg2); animation: drop .45s cubic-bezier(.2,.8,.2,1) both; transition: transform .4s, opacity .4s; }
.banner .bh { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg3); margin-bottom: 3px; }
.banner .bh .k { width: 16px; height: 16px; border-radius: 4px; background: var(--kakao); color: var(--kakao-fg); font-size: 9px; font-weight: 900; display: grid; place-items: center; }
.banner .bh span:last-child { margin-left: auto; }
.banner b { display: block; color: var(--fg); font-size: 13.5px; }
.banner.out { transform: translateY(-140%); opacity: 0; }
@keyframes drop { from { transform: translateY(-140%); } to { transform: none; } }

/* PB 워크스페이스(index.html · cx.js) 안에 ?embed 로 들어왔을 때: 시나리오 탭은 바깥에 있으므로 숨김 */
.embed .tabs, .embed .side .badge { display: none; }
.embed .page { padding-block: 8px 24px; }
.embed .side h1 { margin-top: 0; }
@media (prefers-reduced-motion: reduce) { .bubble, .okmark, .bubble .acts button.hot { animation: none; } .spin { animation-duration: 2s; } }
@media (max-width: 860px) {
  .page { grid-template-columns: 1fr; gap: 28px; padding-block: 24px 40px; }
  .side { position: static; }
  .phone { margin: 0 auto; }
}
@media (max-width: 440px) {
  .phone { padding: 8px; border-radius: 40px; }
  .screen { height: 700px; border-radius: 32px; }
  .pad { padding: 8px 16px 20px; }
}
</style>

<main class="page">
  <aside class="side">
    <span class="badge">시연용 가상 화면 · 가상 고객</span>
    <h1 id="who-h1">고객 이도윤 님의 화면</h1>
    <p class="lead">귀띔을 받은 고객이 무엇을 보고, 어떻게 다음 행동까지 가는지 직접 눌러보세요.</p>
    <div class="tabs" role="group" aria-label="시나리오">
      <button type="button" id="tab-cma" data-flow="cma">예수금 → CMA</button>
      <button type="button" id="tab-call" data-flow="call">상담 전날 알림</button>
    </div>
    <ol class="steps" id="steps"></ol>
    <div class="behind"><div class="l">이 단계에서 귀띔이 하는 일</div><p id="behind"></p></div>
    <button type="button" class="reset" id="reset">처음부터 다시 보기</button>
    <p class="disc"><span id="who-disc">이도윤</span> 님은 가상 고객이며 금액·날짜·금리는 시연용 가정입니다. 실제 계좌 개설·이체·인증은 일어나지 않습니다. 특정 상품의 가입을 권유하지 않습니다.</p>
  </aside>
  <div class="phone"><div class="screen" id="screen"></div></div>
</main>

<script>
(() => {
  const QS = new URLSearchParams(window.__SAILOG_QS || location.search);   // __SAILOG_QS: 한 파일 버전(dist)에서 주입
  const EMBED = QS.has('embed'), MINI = QS.has('mini');   // mini: PB 화면 시연 모드의 고객 폰 패널 (live.js)
  if (EMBED) document.documentElement.classList.add('embed');
  if (MINI) document.documentElement.classList.add('mini');
  let waiting = MINI;   // 시연 모드: PB가 귀띔을 보내기 전까지 잠금화면으로 대기
  // 고객 행동 → PB 화면(live.js)에 알림: open · check · cma-done · appt
  const tell = (type, extra = {}) => { if (EMBED && window.parent !== window) parent.postMessage({ sailogLive: { type, custId: P.custId, name: P.name, ...extra } }, '*'); };

  /* ---------- 날짜 도우미 (시연 기준일 2026-10-29) ---------- */
  const TODAY = '2026-10-29';
  const p2 = (n) => String(n).padStart(2, '0');
  const DOW = '일월화수목금토';
  const dt = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const iso = (d) => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
  const addD = (s, n) => { const d = dt(s); d.setDate(d.getDate() + n); return iso(d); };
  const nextBiz = (s) => { let x = addD(s, 1); while ([0, 6].includes(dt(x).getDay())) x = addD(x, 1); return x; };
  const gap = (a, b) => Math.round((dt(a) - dt(b)) / 864e5);
  const md = (s) => { const d = dt(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; };
  const mdShort = (s) => { const d = dt(s); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };
  const longDay = (s) => { const d = dt(s); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`; };
  const ampm = (t) => { const [h, m] = t.split(':').map(Number); return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${p2(m)}`; };
  const esc = (s) => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  /* ---------- 고객(페르소나) ----------
     기본: 가상 고객 이도윤 님 (PB 화면 고객 id 125, 10월 15일 통화 CALL-0031에서 잡힌 11월 3일 상담).
     PB 화면(index.html · cx.js)에서 고객·귀띔을 골라 열면 postMessage { sailogPersona, flow } 로 바뀜. */
  const DEF = {
    custId: 125, name: '이도윤', cash: 12400000, idle: 47, rCma: 2.75, rDep: 0.1, lastTrade: '9월 12일 마지막 거래 후 그대로',
    call: { date: '2026-11-03', time: '14:00', visit: false, topic: 'ELB 만기금 운용', fromCall: '2026-10-15', quote: false,
      said: ['자녀 대학 등록금이 2027년 2월에 필요하다고 하셨어요.', '원금을 지키는 운용을 원하셨어요.', 'ELB 3,000만원이 11월 5일 만기라 그 전에 다시 연락드리기로 했어요.'],
      agenda: ['ELB 만기금 3,000만원을 받을 계좌와 운용 방향', '등록금을 낼 때까지 자금 일정'],
      prep: ['등록금으로 필요한 금액', '만기금 중 바로 쓰실 돈이 있는지'],
      lead: '이번에는 <strong>11월 5일 만기되는 ELB 3,000만원</strong>을 어떻게 운용할지 이야기 나눌 예정이에요.',

          <div class="card" style="text-align:left">
            <div class="row"><span>CMA 잔액</span><b>${won(S.amt)}</b></div>
            <div class="row"><span>하루 이자 (세전 · 가정)</span><b class="up">약 ${won(S.amt * P.rCma / 100 / 365)}</b></div>
            <div class="row"><span>담당 PB</span><b>조은식 PB에게 전달됨</b></div>
          </div>
          <div class="card" style="text-align:left"><div class="t">다음에 이렇게 알려드려요</div>
            <ul class="list">${P.next.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
        </div></div>
        <div class="cta"><button type="button" class="btn" data-act="finish">카카오톡으로 돌아가기</button></div>` }),
    },
    call: {
      chat: () => { const c = P.call, s0 = callSlots()[0]; return { kakao: true, html: `${nav('유진투자증권')}<div class="scroll">
        <div class="day"><span>${longDay(addD(c.date, -1))}</span></div>
        ${msg(`<div class="bd"><b>내일 상담 일정이 있어요</b>
          <p>${P.name} 고객님, ${c.fromCall ? `지난 ${mdShort(c.fromCall)} 통화에서 ` : ''}약속드린 상담 일정을 알려드려요.</p>
          <div class="box"><div><span>일시</span><b>${label(s0)}</b></div><div><span>방식</span><b>${c.visit ? '서울WM센터 방문' : '전화 · 약 20분'}</b></div><div><span>담당</span><b>조은식 PB</b></div></div>
          <p>${c.lead}</p></div>
          <div class="acts"><button type="button" class="${S.done ? '' : 'hot'}" data-go="appt">상담 내용 미리 보기</button><button type="button" data-go="resched">시간 바꾸기</button></div>`, '오후 6:00')}
        ${S.done ? doneBubble('오후 6:03') : ''}
      </div>` }; },
      appt: () => { const c = P.call, s0 = callSlots()[0]; return { html: `${nav('다가오는 상담', 'chat')}<div class="scroll"><div class="pad">
          <div class="eb">내일 상담</div>
          <h2 class="h">조은식 PB와<br>이렇게 이야기해요</h2>
          <div class="appt"><span class="chip">D-1</span><div class="when">${label(s0)}</div><div class="how">${c.visit ? '서울WM센터 방문' : '전화 상담 · 약 20분'} · 조은식 PB</div></div>
          ${c.said && c.said.length ? `<div class="card"><div class="t">${c.quote ? '지난 통화에서 하신 말씀' : '지난 상담에서 나눈 이야기'}${c.fromCall ? ` · ${mdShort(c.fromCall)} 통화` : ''}</div>
            <ul class="list">${c.said.map(t => `<li>${c.quote ? `“${esc(t)}”` : esc(t)}</li>`).join('')}</ul></div>` : ''}
          <div class="card"><div class="t">이번에 이야기할 것</div>
            <ul class="list">${c.agenda.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
          <div class="card"><div class="t">미리 생각해 두시면 좋아요</div>
            <ul class="list">${c.prep.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
        </div></div>
        <div class="cta"><button type="button" class="btn" data-act="keep">이 시간 좋아요</button><button type="button" class="btn sub" data-go="resched">시간 바꾸기</button></div>` }; },
      resched: () => slotScreen('appt', '조은식 PB 일정 기준', P.call.limit),
      ok: () => okScreen((s) => Math.max(1, gap(s.date, addD(P.call.date, -1))), P.call.topic),
    },
    info: {
      chat: () => ({ kakao: true, html: `${nav('유진투자증권')}<div class="scroll">
        <div class="day"><span>${longDay(TODAY)}</span></div>
        ${msg(`${tplBubble(P.msg)}
          <div class="acts"><button type="button" class="${S.done ? '' : 'hot'}" data-go="detail">${esc(P.msg.buttons[0])}</button><button type="button" data-go="book">PB 상담 예약</button></div>`, '오전 9:00', true, P.msg.tag || '귀띔 도착')}
        ${S.done ? doneBubble('오전 9:06') : ''}
      </div>` }),
      detail: () => ({ html: `${nav(esc(P.tplName), 'chat')}<div class="scroll"><div class="pad">
          <div class="eb">${esc(P.tplName)}</div>
          <h2 class="h">${esc(P.msg.title)}</h2>
          <div class="card"><div class="t">${P.name} 님 계좌 기준</div>
            ${P.msg.rows.map(([k, v]) => `<div class="row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>
          <div class="card"><div class="t">알아두시면 좋아요</div>
            ${P.msg.body.split(/\n\n+/).slice(1).map(t => `<p style="font-size:14px;color:var(--fg2);margin-bottom:8px">${esc(t)}</p>`).join('')}</div>
          <p class="tiny" style="margin-top:14px">계좌 기록으로 계산한 안내이며, 어떻게 할지는 고객님이 결정하세요.</p>
        </div></div>
        <div class="cta"><button type="button" class="btn" data-go="book">PB와 상담 예약하기</button><button type="button" class="btn sub" data-go="chat">카카오톡으로 돌아가기</button></div>` }),
      book: () => slotScreen('detail', '조은식 PB 일정 기준', `${esc(P.tplName)} 내용으로 이야기 나눌 수 있는 시간이에요.`),
      ok: () => okScreen((s) => Math.max(1, gap(s.date, TODAY)), P.tplName),
    },
  };

  function render() {
    const steps = FLOWS()[S.flow];
    let idx = steps.findIndex(s => s.id === S.step);
    if (S.step === 'chat' && S.done) idx = steps.length - 1;
    $('#who-h1').textContent = `고객 ${P.name} 님의 화면`;
    $('#who-disc').textContent = P.name;
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.flow === S.flow));
    $('#steps').innerHTML = steps.map((s, i) => `<li class="${i < idx ? 'past' : i === idx ? 'now' : ''}"><i>${i < idx ? '✓' : i + 1}</i><div><b>${s.t}</b><span>${s.d}</span></div></li>`).join('');
    $('#behind').textContent = steps[idx].b;
    const sc = $('#screen');
    if (waiting) {
      sc.className = 'screen lockscr';
      sc.innerHTML = status() + `<div class="wait"><div class="wt">9:41</div><div class="wd">${longDay(TODAY)}</div>
        <div class="wn"><b>새 알림이 없어요</b>PB 화면에서 귀띔을 보내면<br>이 폰에 바로 도착해요</div></div>`;
      return;
    }
    const v = V[S.flow][S.step]();
    sc.className = 'screen' + (v.kakao ? ' kakao' : '');
    sc.innerHTML = status() + `<div class="app">${v.html}</div>`;
    const r = $('#amt');
    if (r) r.oninput = () => {
      S.amt = Number(r.value);
      const dep = S.amt * P.rDep / 100, cma = S.amt * P.rCma / 100, max = P.cash * P.rCma / 100;
      $('#v-amt').textContent = won(S.amt); $('#v-left').textContent = won(P.cash - S.amt);
      $('#v-dep').textContent = won(dep); $('#v-cma').textContent = won(cma); $('#v-day').textContent = `약 ${won(cma / 365)}`;
      $('#f-dep').style.width = dep / max * 100 + '%'; $('#f-cma').style.width = cma / max * 100 + '%';
      $('#go-check').disabled = !S.amt;
    };
    ['a', 'b'].forEach(k => { const c = $('#ck-' + k); if (c) c.onchange = () => { S[k] = c.checked; $('#go-move').disabled = !(S.a && S.b); }; });
  }

  const go = (step) => {
    if (S.step === 'chat' && step !== 'chat' && !S.opened) { S.opened = true; tell('open', { flow: S.flow }); }
    if (step === 'move') tell('check');
    S.step = step; S.loading = false; render(); const sc = $('.scroll'); if (sc) sc.scrollTop = 0; };
  // PB 캘린더 연동: 고객이 확정한 상담 시간을 저장 → 귀띔 PB 화면(index.html) 일정에 '고객 확정' 약속으로 반영 (calls.js events)
  const APPT_KEY = 'sailog.cx.appt';
  const syncAppt = () => {
    const s = chosen();
    const appt = { custId: P.custId, date: s.date, time: s.time, visit: !!s.visit, slot: label(s), topic: S.flow === 'call' ? P.call.topic : P.tplName,
      changed: S.flow === 'call' && !s.orig, at: new Date().toISOString() };
    try { localStorage.setItem(APPT_KEY, JSON.stringify(appt)); } catch (e) {}
    tell('appt', { slot: appt.slot, topic: appt.topic, visit: appt.visit });
  };
  const toEnd = () => setTimeout(() => { const sc = $('.scroll'); if (sc) sc.scrollTop = sc.scrollHeight; }, 50);
  const ACT = {
    confirm: () => { S.loading = true; render(); setTimeout(() => { go('done'); tell('cma-done', { amt: S.amt }); }, 1300); },
    keep: () => { S.slot = null; syncAppt(); go('ok'); },
    pick: () => { const s = slotList().find(x => keyOf(x) === S.picked); S.slot = s && !s.orig ? s : (S.flow === 'call' ? null : s); syncAppt(); go('ok'); },
    finish: () => { S.done = true; go('chat'); toEnd(); },
    // 고객이 PB 상담을 요청 → PB 화면(live.js)에 알림 + 오늘 일정 등록
    ask: () => { if (S.asked) return; S.asked = true; tell('ask', { from: S.step === 'chat' ? '귀띔' : '예수금 확인 화면' }); go('chat'); toEnd(); },
  };
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-go],[data-act],[data-flow],[data-slot]');
    if (!t || t.disabled) return;
    if (t.dataset.flow) { applyPersona(null); try { if (location.hash !== '#' + t.dataset.flow) location.hash = t.dataset.flow; } catch (e) {} reset(t.dataset.flow); render(); }
    else if (t.dataset.slot) { S.picked = t.dataset.slot; render(); }
    else if (t.dataset.go) go(t.dataset.go);
    else ACT[t.dataset.act]();
  });
  $('#reset').onclick = () => { if (S.flow !== 'cma') { try { localStorage.removeItem(APPT_KEY); } catch (e) {} } reset(S.flow); render(); };
  const canRun = (f) => f === 'cma' || f === 'call' || (f === 'info' && P.msg);
  const fromHash = () => { const h = location.hash.slice(1) || window.__SAILOG_HASH || ''; reset(canRun(h) ? h : 'cma'); render(); };   // __SAILOG_HASH: 한 파일 버전(dist)에서 주입
  window.addEventListener('hashchange', fromHash);
  // PB 화면(cx.js)이 고른 고객으로 바꿔 그리기
  window.addEventListener('message', (e) => {
    const d = e.data; if (!d || !('sailogPersona' in d)) return;
    applyPersona(d.sailogPersona);
    if (d.live) waiting = false;
    reset(canRun(d.flow) ? d.flow : 'cma'); render();
    // 시연 모드: 귀띔 도착 배너가 위에서 내려왔다 들어감
    if (d.live && P.msg) {
      const sc = $('#screen');
      sc.insertAdjacentHTML('beforeend', `<div class="banner" role="status"><div class="bh"><span class="k">K</span>카카오톡 · 유진투자증권<span>지금</span></div><b>${esc(P.msg.title)}</b><span>${esc(P.name)} 고객님께 귀띔이 도착했어요</span></div>`);
      setTimeout(() => { const b = $('#screen .banner'); if (b) b.classList.add('out'); }, 3200);
    }
  });
  fromHash();
  if (EMBED && window.parent !== window) parent.postMessage({ sailogReady: true }, '*');
})();
</script>
