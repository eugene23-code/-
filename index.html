<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사이로그 PB</title>
<script>
/* 배포(웹) 진입 순서: 랜딩(고객 편) → PB 편 → '서비스 이용하기'(app.html) → 이 워크스페이스.
   웹 주소로 처음 들어오면 랜딩으로 보낸다. app.html 을 거쳤거나(세션 표시), 딥링크(#...)이거나,
   로컬 파일·단일 파일 빌드(http/https 아님)면 그대로 워크스페이스를 연다. */
(function () {
  if (!/^https?:$/.test(location.protocol) || location.hash) return;
  try { if (sessionStorage.getItem('sailog.entered')) return; } catch (e) { return; }
  location.replace('landing.html');
})();
</script>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="fonts.css"> <!-- Pretendard: 프로젝트 내 글꼴 파일 (fonts/) -->
<link rel="stylesheet" href="styles.css">
<style>
/* ---------- 레이아웃: 좌측 내비 / 가운데 작업 / 우측 고객 드로어 ---------- */
.app { display: grid; grid-template-columns: 224px 1fr; min-height: 100%; }
.nav {
  position: sticky; top: 0; height: 100vh; background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 20px 14px; gap: 6px;
}
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.logo-mark { width: 32px; height: 32px; flex: none; display: block; }   /* logo.svg: PB·고객 사이를 잇는 로그 */
.logo-text { font-weight: 800; font-size: 18px; letter-spacing: -0.03em; line-height: 1.1; }
.logo-text small { display: block; font-size: 11px; font-weight: 500; color: var(--fg3); letter-spacing: 0; }
.nav-item {
  display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border-radius: 12px;
  font-weight: 600; font-size: 14px; color: var(--fg2); width: 100%; text-align: left;
}
.nav-item:hover { background: var(--surface2); }
.nav-item.active { background: var(--brand-tint); color: var(--brand); }
.nav-item .ico { width: 20px; text-align: center; font-size: 16px; }
.nav-item .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.nav-item.active .badge { background: var(--brand); }
.nav-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-top: 1px solid var(--line); }
.nav-foot b { display: block; font-size: 13px; }
.nav-foot span { font-size: 12px; color: var(--fg3); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px;
  padding: 14px 28px; background: rgba(243,244,246,.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.topbar h2 { font-size: 16px; font-weight: 700; white-space: nowrap; }
.topbar .date { color: var(--fg3); font-size: 13px; white-space: nowrap; }
@media (max-width: 1100px) { .topbar { flex-wrap: wrap; row-gap: 8px; } .topbar .search { width: 180px; } }
.topbar .spacer { flex: 1; }
.search { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; background: var(--surface); border-radius: 10px; border: 1px solid var(--line); width: 220px; }
.search input { border: 0; outline: 0; background: none; width: 100%; font-size: 13px; }
.content { padding: 8px 28px 60px; max-width: 980px; width: 100%; }

/* ---------- 오늘 할 일 ---------- */
.greet { padding: 14px 0 22px; }
.greet h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
.greet p { color: var(--fg2); font-size: 15px; }
.progress { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.progress .bar { flex: 1; height: 8px; background: var(--gray-tint); border-radius: 999px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; width: 0; background: var(--brand); border-radius: 999px; transition: width .4s cubic-bezier(.2,.8,.2,1); }
.progress b { font-size: 13px; white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
.stat { background: var(--surface); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.stat span { display: block; font-size: 12px; color: var(--fg3); margin-bottom: 4px; }
.stat b { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.stat b.brand { color: var(--brand); }

.filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.filter { height: 34px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 13px; color: var(--fg2); }
.filter.active { background: var(--fg); color: #fff; border-color: var(--fg); }
.filter .n { margin-left: 4px; color: var(--fg3); font-weight: 500; }
.filter.active .n { color: #c8ccd2; }

.tasks { display: flex; flex-direction: column; gap: 10px; }
.task {
  display: grid; grid-template-columns: 28px 1fr; gap: 14px; padding: 18px 18px 14px 16px; background: var(--surface);
  border-radius: var(--r); box-shadow: var(--shadow); cursor: pointer; position: relative; overflow: hidden;
  border: 1.5px solid transparent; transition: border-color .15s, transform .35s, opacity .35s, max-height .35s;
}
.task::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--line); }
.task.pri-3::before { background: var(--brand); }
.task.pri-2::before { background: var(--amber); }
.task.selected { border-color: var(--fg); }
.task.leaving { opacity: 0; transform: translateX(24px); }
.check {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid #C9CED6; background: #fff; margin-top: 2px;
  display: grid; place-items: center; transition: all .15s; flex: none;
}
.check:hover { border-color: var(--brand); }
.check.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.check svg { width: 14px; height: 14px; opacity: 0; transform: scale(.6); transition: all .15s; }
.check.on svg { opacity: 1; transform: scale(1); }
.task-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.task-benefit { margin-left: auto; font-weight: 700; font-size: 13px; color: var(--green); white-space: nowrap; }
.task-name { font-size: 13px; color: var(--fg2); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.task-name b { color: var(--fg); font-size: 15px; }
.task-title { font-size: 17px; font-weight: 700; line-height: 1.35; margin-bottom: 4px; }
.task-why { color: var(--fg2); font-size: 13px; line-height: 1.5; }
.task-actions { display: flex; gap: 6px; margin-top: 12px; }
/* 연락 이유 · 멘트 (카드 안 펼침) */
.task-talk { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; cursor: default; }
.task-talk .tk { padding: 12px 14px; border-radius: 12px; background: var(--surface2); display: flex; flex-direction: column; gap: 8px; }
.task-talk .tk-h { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; }
.task-talk .tk-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: start; font-size: 13px; line-height: 1.6; }
.task-talk .tk-row p { margin: 0; color: var(--fg2); min-width: 0; }
.task-talk .tk-l { font-size: 12px; font-weight: 700; color: var(--fg3); padding-top: 1px; }
.task-talk .tk-say { color: var(--fg) !important; font-weight: 500; }
.task-talk .tk-row:last-child .tk-l { color: var(--brand); }
.task-talk .cp { font-size: 11px; color: var(--fg3); font-weight: 600; padding: 2px 6px; border-radius: 6px; }
.task-talk .cp:hover { background: var(--surface); color: var(--fg); }
@media (max-width: 640px) { .task-talk .tk-row { grid-template-columns: 1fr auto; } .task-talk .tk-l { grid-column: 1 / -1; } }
.task-more { font-size: 12px; color: var(--fg3); margin-left: auto; align-self: center; }

.done-box { margin-top: 26px; }
.done-box summary { cursor: pointer; font-weight: 700; color: var(--fg2); font-size: 14px; list-style: none; display: flex; align-items: center; gap: 8px; }
.done-box summary::-webkit-details-marker { display: none; }
.done-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.done-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--surface); border-radius: 12px; color: var(--fg3); font-size: 13px; }
.done-item b { color: var(--fg2); text-decoration: line-through; }
.done-item button { margin-left: auto; color: var(--brand); font-weight: 600; font-size: 12px; }
.empty { text-align: center; padding: 60px 20px; color: var(--fg3); }
.empty b { display: block; font-size: 20px; color: var(--fg); margin-bottom: 6px; }

/* ---------- 고객 목록 ---------- */
.table-wrap { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
th { text-align: left; font-weight: 600; color: var(--fg3); font-size: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--surface2); vertical-align: middle; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface2); }
td.r, th.r { text-align: right; }
.sig-dots { display: inline-flex; gap: 3px; }
.sig-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.sig-dots i.p3 { background: var(--brand); } .sig-dots i.p2 { background: var(--amber); } .sig-dots i.p1 { background: #B0B8C1; }
.toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.toolbar select { height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; }

/* ---------- 알림톡 발송 화면 ---------- */
.send-grid { display: grid; grid-template-columns: 1fr 380px; gap: 20px; align-items: start; }
.tpl-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
.tpl { background: var(--surface); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); cursor: pointer; border: 1.5px solid transparent; text-align: left; }
.tpl.active { border-color: var(--brand); }
.tpl .em { font-size: 22px; }
.tpl b { display: block; margin-top: 6px; font-size: 14px; }
.tpl span { font-size: 12px; color: var(--fg3); }
.recip { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.recip-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.recip-head h3 { font-size: 15px; }
.recip-list { display: flex; flex-direction: column; gap: 4px; max-height: 380px; overflow: auto; }
.recip-item { display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: 10px; cursor: pointer; }
.recip-item:hover, .recip-item.active { background: var(--surface2); }
.recip-item input { accent-color: var(--brand); width: 16px; height: 16px; }
.recip-item .meta { font-size: 12px; color: var(--fg3); }
.recip-item .sent-tag { margin-left: auto; }
.preview-col { position: sticky; top: 76px; }
.preview-col .phone { transform: scale(.92); transform-origin: top center; }

/* ---------- 인사이트 ---------- */
.ins-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.ins { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; }
.ins h3 { font-size: 15px; margin-bottom: 14px; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 10px; font-size: 13px; }
.bar-row .track { height: 18px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.bar-row .fill { height: 100%; background: #3D4A5C; border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-row .v { text-align: right; color: var(--fg2); }
.mv-list { display: flex; flex-direction: column; gap: 8px; }
.mv { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--surface2); border-radius: 10px; font-size: 13px; }
.mv b { font-size: 14px; }
.mv .who { color: var(--fg3); font-size: 12px; }

/* ---------- 고객 드로어 ---------- */
.drawer {
  position: fixed; top: 0; right: 0; height: 100vh; width: 440px; max-width: 100vw; background: var(--surface); z-index: 40;
  box-shadow: -10px 0 40px rgba(25,31,40,.12); transform: translateX(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  display: flex; flex-direction: column;
}
.drawer.open { transform: translateX(0); }
.drawer-head { display: flex; align-items: center; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.drawer-head .x { width: 32px; height: 32px; border-radius: 50%; background: var(--surface2); font-size: 18px; }
.drawer-head .d-id { min-width: 0; line-height: 1.45; }
.drawer-head .d-head-btns { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.drawer .d-hint { margin-top: -14px; font-size: 12px; color: var(--fg3); }
.drawer .kv em { display: block; font-style: normal; font-size: 12px; font-weight: 600; color: var(--brand); margin-top: 2px; }
.drawer .kv em.calm { color: var(--fg3); font-weight: 500; }
.drawer .script-box { margin-top: 10px; }
.drawer .script-box summary { cursor: pointer; font-size: 12px; font-weight: 700; color: var(--brand); list-style: none; }
.drawer .script-box summary::-webkit-details-marker { display: none; }
.drawer .script-box summary::after { content: ' 펼치기'; color: var(--fg3); font-weight: 500; }
.drawer .script-box[open] summary::after { content: ' 접기'; }
.drawer .script-box .script { margin-top: 6px; padding-right: 44px; }
.drawer .kw-row { display: grid; grid-template-columns: 56px 1fr; gap: 8px; align-items: start; padding: 4px 0; }
.drawer .kw-lbl { font-size: 11px; font-weight: 700; color: var(--fg3); padding-top: 4px; }
.drawer .hold .r small + small { margin-top: 1px; }
.drawer .log .ty { display: inline-block; min-width: 30px; text-align: center; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--surface2); color: var(--fg2); }
.drawer .log .ty-buy { background: #FDECEC; color: var(--brand); }
.drawer .log .ty-sell { background: #E8F0FE; color: #1B64DA; }
.drawer .log .ty-in { background: #E8F7EE; color: #0E8A4A; }
.drawer .log .ty-out { background: #FFF3E0; color: #B35C00; }
.drawer-body { flex: 1; overflow: auto; padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 22px; }
.d-name { font-size: 18px; font-weight: 800; }
.d-meta { font-size: 12px; color: var(--fg3); }
.d-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.d-sec h4 { font-size: 13px; font-weight: 700; color: var(--fg3); margin-bottom: 10px; }
.sig { padding: 12px 14px; background: var(--surface2); border-radius: 12px; margin-bottom: 8px; }
.sig .t { font-weight: 700; margin: 6px 0 4px; font-size: 14px; }
.sig .w { font-size: 12px; color: var(--fg2); }
.script { margin-top: 10px; padding: 12px; background: var(--surface); border-radius: 10px; font-size: 13px; line-height: 1.6; border: 1px dashed var(--line); position: relative; }
.script .lbl { font-size: 11px; color: var(--brand); font-weight: 700; margin-bottom: 4px; }
.script .cp { position: absolute; right: 8px; top: 8px; font-size: 11px; color: var(--fg3); font-weight: 600; }
.ai { padding: 14px; border-radius: 12px; background: linear-gradient(135deg, #FFF5F5, #FFF9F3); border: 1px solid #FAE3E3; font-size: 13px; line-height: 1.6; }
.ai .lbl { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--brand); margin-bottom: 6px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kv div { background: var(--surface2); border-radius: 10px; padding: 10px 12px; }
.kv span { display: block; font-size: 11px; color: var(--fg3); }
.kv b { font-size: 15px; }
.hold { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--surface2); font-size: 13px; }
.hold:last-child { border-bottom: 0; }
.hold small { color: var(--fg3); display: block; font-size: 11px; }
.hold .r { text-align: right; }
.log { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; padding: 7px 0; font-size: 12.5px; border-bottom: 1px solid var(--surface2); }
.log:last-child { border-bottom: 0; }
.log .d { color: var(--fg3); }
.log .ty { font-weight: 600; margin-right: 6px; }
.hist { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 7px 0; border-bottom: 1px solid var(--surface2); }
.hist:last-child { border-bottom: 0; }
.hist .d { color: var(--fg3); width: 56px; }
.hist .st { margin-left: auto; }
.scrim { position: fixed; inset: 0; background: rgba(25,31,40,.35); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.on { opacity: 1; pointer-events: auto; }

/* ---------- 모달 (알림톡 발송 / 통화) ---------- */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; }
.modal-card { background: var(--surface); border-radius: 22px; width: 100%; max-width: 820px; max-height: calc(100vh - 40px); overflow: auto; box-shadow: 0 30px 80px rgba(0,0,0,.3); }
.modal-head { display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal-head h3 { font-size: 16px; }
.modal-head .x { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--surface2); font-size: 18px; }
.modal-body { padding: 20px 22px; }
.send-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
.send-layout .phone { transform: scale(.88); transform-origin: top center; }
.tpl-select { display: flex; flex-direction: column; gap: 6px; }
.tpl-opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); cursor: pointer; text-align: left; }
.tpl-opt.active { border-color: var(--brand); background: var(--brand-tint); }
.tpl-opt .em { font-size: 18px; }
.tpl-opt b { font-size: 13px; display: block; }
.tpl-opt span { font-size: 11px; color: var(--fg3); }
.call { text-align: center; padding: 30px 20px 26px; max-width: 520px; }
.call .avatar { margin: 0 auto 12px; }
.call .timer { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 6px 0 18px; }
.call .script { text-align: left; }
.call-actions { display: flex; gap: 8px; margin-top: 18px; }

/* ---------- 고객 상세 페이지 ----------
   순서: 투자 성향·관심 분야(히어로) → 계좌 상황 → 신용·미수·반대매매 → 보유·거래 → 접촉 */
.dt-head { display: flex; align-items: center; gap: 14px; padding: 8px 0 18px; flex-wrap: wrap; }
.dt-head .back { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); font-size: 20px; line-height: 1; flex: none; }
.dt-head .d-name { font-size: 22px; }
.dt-head .d-meta { font-size: 13px; margin-top: 2px; }
.dt-head .acts { margin-left: auto; display: flex; gap: 8px; }
.dt-intro { margin: -4px 0 16px; padding-left: 14px; border-left: 3px solid var(--brand); }
.dt-intro p { font-size: 17px; font-weight: 500; line-height: 1.5; letter-spacing: -.02em; color: var(--fg); text-wrap: pretty; }
.dt-intro p b { font-weight: 700; }
.dt-intro .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; font-size: 12.5px; color: var(--fg3); }
.dt-intro .meta .miss { color: var(--amber); font-weight: 600; }
.dt-sig { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.dt-sig button { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 12px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-size: 13px; font-weight: 600; color: var(--fg); }
.dt-sig button i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dt-sig button.p3 i { background: var(--brand); } .dt-sig button.p2 i { background: var(--amber); } .dt-sig button.p1 i { background: #B0B8C1; }
.dt-sig button span { color: var(--fg3); font-weight: 500; }
.dt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.dt-card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 22px; min-width: 0; }
.dt-card.span { grid-column: 1 / -1; }

    <div class="logo"><img class="logo-mark" src="logo.svg" alt=""><div class="logo-text">사이로그<small>유진투자증권 PB 워크스페이스</small></div></div>
    <button class="nav-item active" data-view="todo"><span class="ico">☑</span>오늘 할 일<span class="badge" id="badge-todo">0</span></button>
    <button class="nav-item" data-view="customers"><span class="ico">👥</span>고객</button>
    <button class="nav-item" data-view="send"><span class="ico">💬</span>알림톡</button>
    <button class="nav-item" data-view="calendar"><span class="ico">📅</span>일정<span class="badge gray" id="badge-cal" hidden>0</span></button>

    <button class="nav-item" data-view="cx"><span class="ico">📱</span>고객 화면</button> <!-- cx.js -->
    <div class="nav-foot"><div class="avatar">조</div><div><b>조은식 PB</b><span>서울WM센터 · 관리고객 <span id="nav-cust-n">32</span>명</span></div></div>
  </nav>

  <div class="main">
    <header class="topbar">
      <h2 id="view-title">오늘 할 일</h2>
      <span class="date" id="today-label"></span>
      <span class="spacer"></span>
      <label class="search"><span>⌕</span><input id="q" type="search" placeholder="고객 이름 검색" autocomplete="off"></label>
      <span class="demo-badge">시연용 가상 화면 · 가상 고객</span>
    </header>

    <div class="content">
      <!-- 오늘 할 일 -->
      <section id="view-todo">
        <div class="greet">
          <h1 id="greet-h1">좋은 아침이에요, 조은식 PB님</h1>
          <p id="greet-p"></p>
          <div class="progress"><div class="bar"><i id="prog-fill"></i></div><b id="prog-text">0 / 0</b></div>
        </div>
        <div class="stats" id="stats"></div>
        <div class="filters" id="filters"></div>
        <div class="tasks" id="tasks"></div>
        <details class="done-box" id="done-box">
          <summary>완료한 일 <span class="pill ok" id="done-count">0</span></summary>
          <div class="done-list" id="done-list"></div>
        </details>
      </section>

      <!-- 고객 -->
      <section id="view-customers" hidden>
        <div class="toolbar">
          <select id="risk-filter"><option value="">투자성향 전체</option><option>안정형</option><option>안정추구형</option><option>위험중립형</option><option>적극투자형</option><option>공격투자형</option></select>
          <select id="sort-filter"><option value="pri">오늘 신호 순</option><option value="total">총자산 순</option><option value="day">오늘 손익 순</option><option value="last">마지막 연락 오래된 순</option></select>
          <span class="muted" id="cust-count" style="margin-left:auto;font-size:13px"></span>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>고객</th><th>투자성향</th><th>관심 섹터 (AI)</th><th class="r">총자산</th><th class="r">예수금</th><th class="r">오늘 손익</th><th>오늘 신호</th><th>마지막 연락</th></tr></thead>
          <tbody id="cust-rows"></tbody>
        </table></div>
      </section>

      <!-- 알림톡 -->
      <section id="view-send" hidden>
        <div class="send-grid">
          <div>
            <div class="tpl-list" id="tpl-list"></div>
            <div class="recip">
              <div class="recip-head"><h3 id="recip-title">추천 대상</h3><span class="muted" id="recip-sub"></span><button class="btn primary sm" id="send-all" style="margin-left:auto">선택 고객에게 발송</button></div>
              <div class="recip-list" id="recip-list"></div>
            </div>
          </div>
          <div class="preview-col" id="send-preview"></div>
        </div>
      </section>

      <!-- 고객 상세 -->
      <section id="view-detail" hidden>
        <div class="dt-head" id="dt-head"></div>
        <div class="dt-intro" id="dt-intro"></div>
        <div class="dt-sig" id="dt-sig"></div>
        <div class="dt-grid" id="dt-grid"></div>
      </section>

      <!-- 일정 (캘린더) : 고객과의 약속 · 할 일만 (통화에서 자동 등록 + 원장 만기·생신·미수 마감 + 직접 추가) -->
      <section id="view-calendar" hidden>
        <div class="cal-layout">
          <div class="cal-main dt-card">
            <div class="cal-head"><button class="cal-nav" id="cal-prev" aria-label="이전 달">‹</button><h3 id="cal-title">2026년 10월</h3><button class="cal-nav" id="cal-next" aria-label="다음 달">›</button><button class="btn sm" id="cal-today">오늘</button></div>
            <div class="cal-grid" id="cal-grid"></div>
          </div>
          <aside class="cal-side">
            <div class="dt-card"><h3 id="agenda-title"></h3><div id="agenda"></div>
              <form id="agenda-add" class="agenda-add"><input id="agenda-input" placeholder="할 일 추가" autocomplete="off"><input id="agenda-time" type="time"><button class="btn sm dark" type="submit">추가</button></form></div>
          </aside>
        </div>
      </section>

      <!-- 인사이트 -->
      <section id="view-insight" hidden>
        <div class="stats" id="ins-stats"></div>
        <div class="ins-grid">
          <div class="ins"><h3>오늘 시장 변동이 닿은 고객</h3><div class="mv-list" id="ins-moves"></div></div>
          <div class="ins"><h3>관심 섹터 (보유 기준, 고객 수)</h3><div class="bars" id="ins-sectors"></div></div>
          <div class="ins"><h3>투자성향 분포</h3><div class="bars" id="ins-risk"></div></div>
          <div class="ins"><h3>오늘 신호 유형</h3><div class="bars" id="ins-signals"></div></div>
        </div>
      </section>

      <!-- 고객 화면 : 고객이 받는 알림톡 이후 흐름 · 서비스 소개 (cx.js) -->
      <section id="view-cx" hidden></section>
    </div>
  </div>
</div>

  <div class="drawer-head" id="drawer-head"></div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script src="data.js"></script>
<script src="ui.js"></script>
<script src="reco.js"></script> <!-- 고객 상세: 세미나·상품 개인화 제안 블록 -->
<script src="fund.js"></script> <!-- 고객 상세: AI 펀드 매칭 (분석하기 → 상위 5 공모펀드, 시연용 가상 펀드) -->
<script src="calls.js"></script>     <!-- 통화 기록 · 요약 · 준법 감지 · 일정 엔진 -->
<script src="calendar.js"></script>  <!-- 캘린더 · 통화 요약 · 준법 알림 UI -->
<script src="cx.js"></script>
<script src="live.js"></script>      <!-- 시연 모드: PB 작업 ↔ 고객 폰 실시간 연결 -->        <!-- 고객 화면 탭: customer.html · landing.html 임베드 + 진입 버튼 -->
<script src="custfilter.js"></script> <!-- 고객 목록: 빠른 보기 + 기능별 상세 필터 + 일괄 알림톡 -->
<script>
/* 시세 상태 배지: 실제 시세 적용 여부 · 출처 · 기준 시각 */
(() => {
  const M = SAILOG.MARKET, el = document.getElementById('market-badge');
  if (!el) return;
  if (M.live) {
    const t = M.asOf ? new Date(M.asOf) : null;
    const hm = t ? `${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')}` : '';
    el.textContent = `실시간 시세 ${hm} · KR 네이버금융 · US yfinance · $${Math.round(SAILOG.FX).toLocaleString()}`;
    el.title = `적용 ${M.applied}종목${M.errors.length ? ` · 오류 ${M.errors.length}건` : ''} · ${M.asOf}`;
    el.style.color = 'var(--green)'; el.style.background = 'var(--green-tint)'; el.style.borderColor = 'transparent';
  } else {
    el.textContent = '시세 임시값 · market/collect.ps1 실행 시 실제 시세 적용';
  }
})();
</script>
<script>
(() => {
  const { CUSTOMERS, TODOS, TEMPLATES, PEER, won, pct, fmtDate, dayDiff, byId, TODAY, PB } = SAILOG;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = UI.esc;

  /* ---------- 상태 ---------- */
  const state = { view: 'todo', filter: 'all', done: new Set(), selected: null, sent: [], recip: new Set(), tpl: 'cma', talk: new Set() };
  try { const d = JSON.parse(localStorage.getItem('sailog.done') || '[]'); d.forEach(x => state.done.add(x)); } catch (e) {}
  const persist = () => { try { localStorage.setItem('sailog.done', JSON.stringify([...state.done])); } catch (e) {} };

  const PRI = { 3: '긴급', 2: '높음', 1: '보통' };
  const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const sinceLabel = (d) => { const n = -dayDiff(d); return n === 0 ? '오늘' : n === 1 ? '어제' : `${n}일 전`; };

  $('#today-label').textContent = TODAY.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

  /* ---------- 내비 ---------- */
  const TITLES = { todo: '오늘 할 일', customers: '고객', send: '알림톡', calendar: '일정', insight: '인사이트', detail: '고객 상세', cx: '고객 화면' };
  function show(view) {
    if (view !== 'detail') state.prev = view;
    state.view = view;
    document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === (view === 'detail' ? 'customers' : view)));
    ['todo', 'customers', 'send', 'calendar', 'insight', 'detail', 'cx'].forEach(v => { $('#view-' + v).hidden = v !== view; });
    $('#view-title').textContent = TITLES[view];
    if (view === 'customers') renderCustomers();
    if (view === 'send') renderSend();
    if (view === 'calendar') CAL.render();
    if (view === 'insight') renderInsight();
    if (view === 'cx') SAILOG_CX.render();
    window.scrollTo({ top: 0 });
  }
  document.querySelectorAll('.nav-item').forEach(b => b.addEventListener('click', () => show(b.dataset.view)));

  /* ---------- 오늘 할 일 ---------- */
  const FILTERS = [['all', '전체'], ['3', '긴급'], ['시장변동', '시장변동'], ['절세', '절세'], ['type:MAJOR', '대주주 양도세'], ['자금', '자금'], ['관계', '관계']];
  const openTodos = () => TODOS.filter(t => !state.done.has(t.id));
  const matchKey = (t, k) => k === 'all' || (k === '3' ? t.pri === 3 : k.startsWith('type:') ? t.signals.some(s => s.type === k.slice(5)) : t.cats.includes(k));
  const matchFilter = (t) => matchKey(t, state.filter);

  function renderTodo() {
    const open = openTodos(); const doneN = TODOS.length - open.length;
    $('#badge-todo').textContent = open.length;
    $('#greet-p').textContent = open.length ? `오늘 연락이 필요한 고객 ${open.length}명이 있어요. 급한 순서로 정리했어요.` : '오늘 할 일을 모두 마쳤어요.';
    $('#prog-fill').style.width = `${(doneN / TODOS.length) * 100}%`;
    $('#prog-text').textContent = `${doneN} / ${TODOS.length} 완료`;
    const benefit = open.reduce((a, t) => a + t.signals.reduce((b, s) => b + (s.type === 'CMA' || s.type === 'TAX' || s.type === 'PENSION' || s.type === 'ISA_MATURITY' ? (s.benefit || 0) : 0), 0), 0);
    $('#stats').innerHTML = [
      ['긴급', open.filter(t => t.pri === 3).length + '건', 'brand'],
      ['높음', open.filter(t => t.pri === 2).length + '건'],
      ['고객이 챙길 수 있는 금액', won(benefit)],
      ['알림톡 발송 가능', open.filter(t => t.signals.some(s => s.template)).length + '명'],
    ].map(([k, v, c]) => `<div class="stat"><span>${k}</span><b class="${c || ''}">${v}</b></div>`).join('');
    $('#filters').innerHTML = FILTERS.map(([k, l]) => { const n = open.filter(t => matchKey(t, k)).length; return `<button class="filter ${state.filter === k ? 'active' : ''}" data-f="${k}">${l}<span class="n">${n}</span></button>`; }).join('');
    document.querySelectorAll('.filter').forEach(b => b.onclick = () => { state.filter = b.dataset.f; renderTodo(); });

    const list = open.filter(matchFilter);
    $('#tasks').innerHTML = list.length ? list.map(taskHTML).join('') : `<div class="empty"><b>${open.length ? '이 분류에는 남은 일이 없어요' : '오늘 할 일을 모두 마쳤어요 👏'}</b>${open.length ? '다른 분류를 확인해 보세요.' : '내일 아침, 밤사이 로그를 다시 분석해 드릴게요.'}</div>`;
    document.querySelectorAll('.task').forEach(el => {
      const id = Number(el.dataset.id);
      el.classList.toggle('selected', state.selected === id);
      el.onclick = () => openDrawer(id);
      $('.check', el).onclick = (e) => { e.stopPropagation(); complete(id, el); };
      $('.task-name b', el).onclick = (e) => { e.stopPropagation(); openDetail(id); };
      $('.task-name b', el).style.cursor = 'pointer';
      $('[data-act="script"]', el).onclick = (e) => { e.stopPropagation(); state.talk.has(id) ? state.talk.delete(id) : state.talk.add(id); renderTodo(); };
      el.querySelectorAll('[data-copy]').forEach(b => b.onclick = (e) => { e.stopPropagation(); UI.copy(b.dataset.copy); });
      const tk = $('.task-talk', el); if (tk) tk.onclick = (e) => e.stopPropagation();
      const sb = $('[data-act="send"]', el); if (sb) sb.onclick = (e) => { e.stopPropagation(); openSendModal(id); };
    });

    const doneList = TODOS.filter(t => state.done.has(t.id));
    $('#done-count').textContent = doneList.length;
    $('#done-list').innerHTML = doneList.map(t => `<div class="done-item"><span>✓</span><b>${esc(t.customer.name)}</b><span>${esc(t.main.title)}</span><button data-undo="${t.id}">되돌리기</button></div>`).join('') || '<div class="muted" style="font-size:13px;padding:6px 0">아직 완료한 일이 없어요.</div>';
    document.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => undo(Number(b.dataset.undo)));
    CAL.refreshBadges(); // 일정 배지 (오늘 할 일 건수)
  }

  function taskHTML(t) {
    const c = t.customer;
    return `<article class="task pri-${t.pri}" data-id="${t.id}">
      <button class="check" aria-label="완료 처리">${CHECK_SVG}</button>
      <div class="task-main">
        <div class="task-top"><span class="pill pri-${t.pri}">${PRI[t.pri]}</span>${[...new Set(t.signals.map(s => s.label))].map(l => `<span class="chip">${esc(l)}</span>`).join('')}${t.benefit ? `<span class="task-benefit">${esc(t.benefit)}</span>` : ''}</div>
        <div class="task-name"><b>${esc(c.name)}</b><span>${c.age}세 · ${c.risk} · 마지막 연락 ${sinceLabel(c.last)}</span></div>
        <h3 class="task-title">${esc(t.main.title)}</h3>
        <p class="task-why">${esc(t.main.why)}</p>
        <div class="task-actions">
          <button class="btn sm ${state.talk.has(t.id) ? '' : 'dark'}" data-act="script">${state.talk.has(t.id) ? '멘트 접기' : '🗒️ 연락 이유 · 멘트'}</button>
          ${t.signals.some(s => s.template) ? `<button class="btn sm" data-act="send">💬 알림톡</button>` : ''}
          ${t.signals.length > 1 ? `<span class="task-more">신호 ${t.signals.length}개 · 자세히</span>` : ''}
        </div>
        ${state.talk.has(t.id) ? talkHTML(t) : ''}
      </div></article>`;
  }
  /* 연락 이유 · 멘트: 신호별로 왜 연락하는지 + PB가 할 말(AI 초안). 통화 화면 없이 카드 안에서 펼친다 */
  function talkHTML(t) {
    return `<div class="task-talk">${t.signals.map(s => `<div class="tk">
      <div class="tk-h"><span class="chip">${esc(s.label)}</span><b>${esc(s.title)}</b></div>
      <div class="tk-row"><span class="tk-l">연락 이유</span><p>${esc(s.why)}</p></div>
      <div class="tk-row"><span class="tk-l">멘트</span><p class="tk-say">“${esc(s.script)}”</p><button class="cp" data-copy="${esc(s.script)}">복사</button></div>
    </div>`).join('')}</div>`;
  }

  function complete(id, el) {
    if (el) { $('.check', el).classList.add('on'); el.classList.add('leaving'); }
    setTimeout(() => {
      state.done.add(id); persist();
      const remaining = openTodos().filter(matchFilter);
      if (state.selected === id) { state.selected = null; closeDrawer(); }
      renderTodo();
      if (remaining.length) { openDrawer(remaining[0].id, true); }
      UI.toast(`${byId(id).name} 고객 완료 처리했어요`, '되돌리기', () => undo(id));
    }, el ? 320 : 0);
  }
  function undo(id) { state.done.delete(id); persist(); renderTodo(); }

  /* ---------- 고객 드로어 ---------- */
  function openDrawer(id, soft) {
    const c = byId(id); state.selected = id;
    document.querySelectorAll('.task').forEach(el => el.classList.toggle('selected', Number(el.dataset.id) === id));
    $('#drawer-head').innerHTML = `<div class="avatar lg">${c.initial}</div><div class="d-id"><div class="d-name">${esc(c.name)}</div><div class="d-meta">${c.age}세 · ${c.risk}</div><div class="d-meta">${c.phone} · 마지막 연락 ${sinceLabel(c.last)}</div></div><div class="d-head-btns"><button class="btn sm" id="d-detail">상세 보기</button><button class="x" aria-label="닫기">×</button></div>`;
    $('#drawer-head .x').onclick = closeDrawer;
    $('#d-detail').onclick = () => openDetail(id);
    const sendable = c.signals.some(s => s.template);
    const sigHTML = (s, i) => `<div class="sig"><span class="pill pri-${s.pri}">${PRI[s.pri]}</span> <span class="chip">${esc(s.label)}</span><div class="t">${esc(s.title)}</div><div class="w"><b style="color:var(--fg2)">연락 이유</b> · ${esc(s.why)}</div>
      <details class="script-box" ${i === 0 ? 'open' : ''}><summary>멘트 (AI 초안)</summary><div class="script">${esc(s.script)}<button class="cp" data-copy="${esc(s.script)}">복사</button></div></details></div>`;
    $('#drawer-body').innerHTML = `
      <div class="d-actions">
        <button class="btn ${sendable ? 'dark' : ''}" id="d-send" ${sendable ? '' : 'disabled style="opacity:.5" title="오늘 신호는 알림톡 양식이 없어 직접 연락으로 안내해요"'}>💬 알림톡</button>
        <button class="btn" id="d-done" ${state.done.has(id) ? 'disabled style="opacity:.5"' : ''}>✓ 완료</button>
      </div>
      ${sendable ? '' : '<div class="d-hint">오늘 신호는 알림톡 양식이 없어 아래 멘트로 직접 연락해요.</div>'}
      <div class="d-sec"><h4>계좌 요약</h4><div class="kv">
        <div><span>총자산</span><b class="num">${won(c.total)}</b></div>
        <div><span>예수금</span><b class="num">${won(c.cash)}</b><em class="${c.idle >= 30 ? '' : 'calm'}">${c.idle}일 미운용</em></div>
        <div><span>평가손익</span><b class="num ${c.pnl >= 0 ? 'up' : 'down'}">${won(c.pnl)}</b></div>
        <div><span>오늘 손익</span><b class="num ${c.dayPnl >= 0 ? 'up' : 'down'}">${won(c.dayPnl)}</b></div>
      </div></div>
      ${c.signals.length ? `<div class="d-sec"><h4>오늘의 신호 ${c.signals.length}</h4>${c.signals.map(sigHTML).join('')}</div>` : '<div class="d-sec"><h4>오늘의 신호</h4><div class="muted" style="font-size:13px">오늘은 특별한 신호가 없어요.</div></div>'}
      <div class="d-sec"><h4>최근 통화 <span class="muted" style="font-weight:500">AI 요약</span></h4>${CAL.drawerCallsHTML(id)}</div>
      <div class="d-sec"><h4>AI 분석</h4><div class="ai"><div class="lbl">◆ 거래 로그 기반 투자성향 분석</div>${analysisKeywords(c).filter(g => g.items.length).map(g => `<div class="kw-row"><span class="kw-lbl">${esc(g.label)}</span><div class="kw-chips">${g.items.map(k => kwHTML({ ...k, sm: true })).join('')}</div></div>`).join('')}</div></div>
      <div class="d-sec"><h4>보유 종목 ${c.holdings.length}</h4>${c.holdings.map(h => `<div class="hold"><div><b>${esc(h.name)}</b> <span class="muted" style="font-size:11px">${h.code}</span><small>${h.qty.toLocaleString()}주 · 평단 ${h.mkt === 'US' ? '$' + h.avg.toLocaleString() : h.avg.toLocaleString() + '원'} · 비중 ${Math.round(h.value / c.total * 100)}%</small></div><div class="r num"><b>${won(h.value)}</b><small class="${h.pnl >= 0 ? 'up' : 'down'}">${h.pnl >= 0 ? '+' : ''}${won(h.pnl)} (${pct(h.pnlPct)})</small><small class="muted">오늘 ${pct(h.chg)}</small></div></div>`).join('')}</div>
      <div class="d-sec"><h4>거래 · 입출금 기록 <span class="muted" style="font-weight:500">최근 ${c.logs.length}건</span></h4>${c.logs.map(l => `<div class="log"><span class="d">${fmtDate(l.date)}</span><span><span class="ty ty-${{ '매수': 'buy', '매도': 'sell', '입금': 'in', '출금': 'out' }[l.type] || 'etc'}">${esc(l.type)}</span>${esc(l.desc)}</span><span class="num ${l.amount == null || l.amount < 0 ? 'muted' : ''}">${l.amount == null ? '' : (l.amount >= 0 ? '+' : '') + won(l.amount)}</span></div>`).join('')}</div>
      <div class="d-sec"><h4>알림톡 이력</h4>${[...state.sent.filter(s => s.id === id).map(s => ({ date: 'today', template: s.tpl, status: '발송됨' })), ...c.history].map(h => `<div class="hist"><span class="d">${h.date === 'today' ? '오늘' : fmtDate(h.date)}</span><span>${esc(TEMPLATES[h.template].name)}</span><span class="pill ${h.status === '읽음' || h.status === '발송됨' ? 'ok' : ''} st">${h.status}</span></div>`).join('') || '<div class="muted" style="font-size:13px">발송 이력이 없어요.</div>'}</div>`;
    if (sendable) $('#d-send').onclick = () => openSendModal(id);
    $('#d-done').onclick = () => { closeDrawer(); complete(id, document.querySelector(`.task[data-id="${id}"]`)); };
    document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => UI.copy(b.dataset.copy));
    $('#drawer').classList.add('open');
    if (!soft || window.innerWidth <= 1100) $('#scrim').classList.add('on');
    $('#drawer-body').scrollTop = 0;
  }
  function closeDrawer() { $('#drawer').classList.remove('open'); $('#scrim').classList.remove('on'); state.selected = null; document.querySelectorAll('.task').forEach(el => el.classList.remove('selected')); }
  $('#scrim').onclick = () => { closeDrawer(); closeModal(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDrawer(); closeModal(); } });

  /* ---------- 거래 로그 분석 → 키워드 (문장 없이 칩으로만 표시) ----------
     tone: brand = 핵심, warn = 리스크, 없음 = 일반 */
  function analysisKeywords(c) {
    const p = c.profile, cr = c.credit, top = p.sectors;
    const pc = (v) => `${Math.round(v * 100)}%`;
    const styleKw = p.freq >= 8 ? '단타형' : p.freq >= 4 ? '스윙형' : '장기 보유형';
    const asset = [];
    if (top[0] && top[0].weight >= 0.5 && !/ETF/.test(top[0].sector)) asset.push({ t: `${top[0].sector} 집중`, sub: pc(top[0].weight), tone: 'warn' });
    if (p.usRatio > 0.3) asset.push({ t: '해외 중심', sub: pc(p.usRatio), tone: 'warn' });
    if (p.cashRatio > 0.4) asset.push({ t: '대기 자금 큼', sub: `현금 ${pc(p.cashRatio)}` });
    if (top.length && top.every(s => /ETF/.test(s.sector))) asset.push({ t: 'ETF 위주' });
    if (cr.loan > 0) asset.push({ t: '신용 사용', sub: pc(cr.loan / c.total), tone: cr.status === 'ok' ? '' : 'warn' });
    if (cr.receivable > 0) asset.push({ t: '미수 발생', tone: 'warn' });
    if (!asset.length) asset.push({ t: '분산형' });
    const norm = (s) => s.replace(/\s|주식/g, '');
    const tags = c.tags.filter(t => !asset.some(a => norm(a.t) === norm(t)));
    return [
      { label: '성향', items: [{ t: c.risk, tone: 'brand' }, { t: styleKw }] },
      { label: '관심 분야', items: top.slice(0, 3).map((s, i) => ({ t: s.sector, sub: pc(s.weight), tone: i === 0 ? 'brand' : '' })) },
      { label: '거래', items: [{ t: `월 ${p.freq}건` }, { t: `보유 ${p.hold}일` }] },
      { label: '자산', items: asset },
      { label: '행동', items: tags.map(t => ({ t })) },
    ];
  }
  /* 관심 분야 도넛: 총자산 대비 실제 비중. 섹터는 국내·해외 종목을 합산 (예: 삼성전자+NVDA = 반도체) */
  function sectorDonut(c) {
    const by = {};
    c.holdings.forEach(h => { const s = by[h.sector] || (by[h.sector] = { v: 0, kr: 0, us: 0 }); s.v += h.value; s[h.mkt === 'US' ? 'us' : 'kr'] += h.value; });
    let secs = Object.entries(by).map(([name, s]) => ({ name, ...s })).sort((a, b) => b.v - a.v);
    if (secs.length > 4) { const rest = secs.slice(3); secs = secs.slice(0, 3).concat({ name: '기타', v: rest.reduce((a, s) => a + s.v, 0), kr: 0, us: 0 }); }
    const COLORS = ['var(--brand)', '#3D4A5C', '#7D8794', '#B0B8C1'];
    const slices = secs.map((s, i) => ({ ...s, color: COLORS[i] }));
    if (c.cash > 0) slices.push({ name: '예수금', v: c.cash, kr: 0, us: 0, color: '#E3E6EA', cash: true });
    const total = c.total, R = 52, C = 2 * Math.PI * R;
    let off = 0;
    const arcs = slices.map(s => { const len = s.v / total * C; const gap = slices.length > 1 ? Math.min(2, len / 2) : 0; const el = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${s.color}" stroke-width="22" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}"><title>${esc(s.name)} ${Math.round(s.v / total * 100)}%</title></circle>`; off += len; return el; }).join('');
    const top = secs[0];
    const split = (s) => s.kr && s.us ? `<small>국내 ${Math.round(s.kr / total * 100)} · 해외 ${Math.round(s.us / total * 100)}</small>` : s.us ? '<small>해외</small>' : s.kr ? '<small>국내</small>' : '';
    return `<div class="donut-wrap">
      <svg class="donut" viewBox="0 0 140 140" role="img" aria-label="자산 비중"><g transform="rotate(-90 70 70)">${arcs}</g>
        ${top ? `<text x="70" y="66" text-anchor="middle" class="d-name">${esc(top.name)}</text><text x="70" y="86" text-anchor="middle" class="d-val">${Math.round(top.v / total * 100)}%</text>` : ''}</svg>
      <div class="donut-lg">${slices.map(s => `<div><i style="background:${s.color}"></i><span class="n">${esc(s.name)}${s.cash ? '' : split(s)}</span><b class="num">${Math.round(s.v / total * 100)}%</b></div>`).join('')}</div></div>`;
  }

  const kwHTML = (k) => `<span class="kw ${k.tone || ''} ${k.sm ? 'sm' : ''}">${esc(k.t)}${k.sub ? `<small>${esc(k.sub)}</small>` : ''}</span>`;

  /* ---------- 고객 상세 페이지 ---------- */
  function openDetail(id) {
    const c = byId(id); if (!c) return;
    state.detail = id; closeDrawer();
    const p = c.profile, cr = c.credit;
    const sendable = c.signals.some(s => s.template);

    $('#dt-head').innerHTML = `<button class="back" id="dt-back" aria-label="뒤로">‹</button><div class="avatar lg">${c.initial}</div>
      <div><div class="d-name">${esc(c.name)}</div><div class="d-meta">${c.age}세 · ${c.risk} · ${c.phone} · 마지막 연락 ${sinceLabel(c.last)}</div></div>
      <div class="acts"><button class="btn dark" id="dt-call">📞 전화</button><button class="btn" id="dt-send" ${sendable ? '' : 'disabled style="opacity:.5"'}>💬 알림톡</button></div>`;
    $('#dt-back').onclick = () => show(state.prev || 'customers');
    $('#dt-call').onclick = () => startCall(id);
    if (sendable) $('#dt-send').onclick = () => openSendModal(id);

    $('#dt-intro').innerHTML = introHTML(c);

    $('#dt-sig').innerHTML = c.signals.length
      ? c.signals.map((s, i) => `<button class="p${s.pri}" data-i="${i}"><i></i>${esc(s.label)}<span>${esc(s.title.length > 34 ? s.title.slice(0, 34) + '…' : s.title)}</span></button>`).join('')
      : '<span class="dt-empty">오늘은 특별한 신호가 없어요.</span>';
    document.querySelectorAll('#dt-sig button').forEach(b => b.onclick = () => openDrawer(id));

    /* 1. 투자 성향 · 관심 분야 */
    const top = p.sectors.slice(0, 5);
    const kwGroups = analysisKeywords(c).filter(g => g.label !== '관심 분야');
    const sty = [
      ['거래 빈도', p.freq, PEER.freq, 16, `월 ${p.freq}건`],
      ['보유 기간', p.hold, PEER.hold, 320, `${p.hold}일`],
      ['해외 비중', p.usRatio, PEER.usRatio, 1, `${Math.round(p.usRatio * 100)}%`],
      ['현금 비중', p.cashRatio, PEER.cashRatio, 1, `${Math.round(p.cashRatio * 100)}%`],
      ['레버리지', cr.loan / c.total, PEER.leverage, 0.5, cr.loan ? `신용 ${Math.round(cr.loan / c.total * 100)}%` : '없음'],
    ];
    const px = (v, max) => Math.max(2, Math.min(98, v / max * 100));
    const hero = `<div class="dt-card dt-hero">
      <div><div class="eyebrow">투자 성향 · 거래 로그 분석</div>
        <div class="kw-groups">${kwGroups.map(g => `<div class="kw-row"><span class="lbl">${esc(g.label)}</span><div class="kw-chips">${g.items.map(kwHTML).join('')}</div></div>`).join('')}</div></div>
      <div><div class="sub">관심 분야 <span class="muted" style="font-weight:500">총자산 대비 · 국내·해외 합산</span></div>
        ${sectorDonut(c)}</div></div>`;

    const style = `<div class="dt-card"><h3>투자 스타일 <span>관리 고객 ${CUSTOMERS.length}명 평균 대비</span></h3>
      <div class="sty">${sty.map(([l, v, a, max, txt]) => `<div class="sty-row"><span class="l">${l}</span><span class="sc"><span class="rl"></span><span class="av" style="left:${px(a, max)}%"></span><span class="me" style="left:${px(v, max)}%"></span></span><span class="v num">${txt}</span></div>`).join('')}</div>
      <div class="sty-note"><span><i style="width:10px;height:10px;border-radius:50%;background:var(--brand)"></i>이 고객</span><span><i style="width:2px;height:10px;background:var(--fg3)"></i>관리 고객 평균</span></div></div>`;

    /* 2. 계좌 상황 */
    const account = `<div class="dt-card span"><h3>계좌 상황 <span>${c.holdings.length}종목 · 오늘 ${TODAY.getMonth() + 1}월 ${TODAY.getDate()}일</span></h3><div class="dt-stats">
      <div class="dt-stat"><span>총자산</span><b class="num">${won(c.total)}</b></div>
      <div class="dt-stat"><span>평가손익</span><b class="num ${c.pnl >= 0 ? 'up' : 'down'}">${won(c.pnl)}</b><small>${pct(c.invested ? c.pnl / (c.invested - c.pnl) * 100 : 0)}</small></div>
      <div class="dt-stat"><span>오늘 손익</span><b class="num ${c.dayPnl >= 0 ? 'up' : 'down'}">${won(c.dayPnl)}</b></div>
      <div class="dt-stat"><span>예수금</span><b class="num">${won(c.cash)}</b><small>${c.idle >= 30 ? `<span class="down">${c.idle}일 미운용</span>` : `${c.idle}일째 보유`}</small></div></div>
      <div class="bal" id="dt-bal"></div></div>`;

    /* 3. 신용 · 미수 · 반대매매 */
    const stPill = cr.status === 'crit' ? '<span class="pill pri-3">위험</span>' : cr.status === 'warn' ? '<span class="pill pri-2">주의</span>' : '<span class="pill ok">정상</span>';
    let crBody;
    if (cr.loan > 0) {
      const col = cr.ratio < cr.threshold ? 'var(--brand)' : cr.ratio < cr.warnLine ? 'var(--amber)' : 'var(--green)';
      const w = v => Math.min(100, v / 220 * 100);
      crBody = `<div class="cr-big"><b class="num" style="color:${col}">${cr.ratio}%</b><span>담보유지비율 · 신용융자 ${won(cr.loan)}</span></div>
        <div class="cr-meter"><span class="fill" style="width:${w(cr.ratio)}%;background:${col}"></span><span class="mk" style="left:${w(cr.threshold)}%"></span></div>
        <div class="cr-lb"><span>100%</span><span>${cr.threshold}% 반대매매 기준</span><span>220%</span></div>
        <div class="cr-note">${cr.ratio < cr.warnLine ? `보유 주식이 <b>${((1 - cr.threshold / cr.ratio) * 100).toFixed(1)}%</b> 더 내리면 반대매매 대상이에요. 기준선까지 여유 담보 ${won(cr.room)}.` : `기준선까지 여유 담보 ${won(cr.room)}. 보유 주식이 ${((1 - cr.threshold / cr.ratio) * 100).toFixed(0)}% 내려도 기준선 위예요.`}</div>
        <div class="rows">${cr.maturities.map(m => `<div class="row"><div>${esc(m.name)}<small>신용 만기 ${fmtDate(m.date)}</small></div><div class="r num">${won(m.amt)}<small class="dday ${m.d <= 7 ? 'soon' : ''}">D-${m.d}</small></div></div>`).join('')}</div>`;
    } else if (cr.receivable > 0) {
      crBody = `<div class="cr-big"><b class="num" style="color:var(--brand)">${won(cr.receivable)}</b><span>미수금 · 변제 마감 ${esc(cr.receivableDue)}</span></div>
        <div class="cr-note">입금이 없으면 <b>${esc(cr.forced.date)} 장 시작</b>에 ${esc(cr.forced.qty)}가 하한가 기준으로 자동 매도돼요.</div>
        <div class="rows"><div class="row"><div>반대매매 예정</div><div class="r"><span class="dday now">${esc(cr.forced.date)} 09:00</span></div></div><div class="row"><div>예정 수량</div><div class="r">${esc(cr.forced.qty)}</div></div><div class="row"><div>올해 미수 발생</div><div class="r num">${cr.history.filter(h => h.type === '미수 발생').length}회</div></div></div>`;
    } else {
      crBody = `<div class="rows" style="margin-top:0"><div class="row"><div>신용융자</div><div class="r">없음</div></div><div class="row"><div>미수금</div><div class="r">없음</div></div><div class="row"><div>반대매매</div><div class="r">해당 없음</div></div><div class="row"><div>최근 24개월 발생</div><div class="r num">${cr.history.length}회</div></div></div>`;
    }
    const credit = `<div class="dt-card"><h3>신용 · 미수 · 반대매매 ${stPill}</h3>${crBody}</div>`;

    /* 4. 보유 종목 · 거래 기록 */
    const holdRow = (h) => `<div class="hold"><div><b>${esc(h.name)}</b> <span class="muted" style="font-size:11px">${h.code}</span><small>${esc(h.sector)} · ${h.qty.toLocaleString()}주 · 평단 ${h.mkt === 'US' ? '$' + h.avg.toLocaleString() : h.avg.toLocaleString() + '원'} · 비중 ${Math.round(h.value / c.total * 100)}%</small></div><div class="r num"><b>${won(h.value)}</b><small class="pnl ${h.pnl >= 0 ? 'up' : 'down'}">${h.pnl >= 0 ? '+' : ''}${won(h.pnl)} (${pct(h.pnlPct)})</small><small>오늘 <span class="${h.chg >= 0 ? 'up' : 'down'}">${pct(h.chg)}</span></small></div></div>`;
    const mktGroups = [['KR', '국내 주식'], ['US', '해외 주식']].map(([m, label]) => {
      const list = c.holdings.filter(h => h.mkt === m).sort((a, b) => b.value - a.value);
      if (!list.length) return '';
      const sum = list.reduce((a, h) => a + h.value, 0), pnl = list.reduce((a, h) => a + h.pnl, 0);
      return `<div class="hold-grp"><div class="hold-grp-h"><b>${label}</b><span class="muted">${list.length}종목</span><span class="num">${won(sum)}</span><span class="num ${pnl >= 0 ? 'up' : 'down'}">${pnl >= 0 ? '+' : ''}${won(pnl)}</span></div>${list.map(holdRow).join('')}</div>`;
    }).join('');
    const holdings = `<div class="dt-card"><h3>보유 종목 <span>${c.holdings.length}종목 · 평가 ${won(c.invested)}</span></h3>${mktGroups}</div>`;
    const logs = `<div class="dt-card"><h3>거래 · 입출금 기록 <span>최근 ${c.logs.length}건</span></h3>
      ${c.logs.map(l => `<div class="log"><span class="d">${fmtDate(l.date)}</span><span><span class="ty">${esc(l.type)}</span>${esc(l.desc)}</span><span class="num ${l.amount == null || l.amount < 0 ? 'muted' : ''}">${l.amount == null ? '' : (l.amount >= 0 ? '+' : '') + won(l.amount)}</span></div>`).join('')}
      ${cr.history.length ? `<h3 style="margin-top:18px">신용 · 미수 내역</h3>${cr.history.map(h => `<div class="log"><span class="d">${fmtDate(h.date)}</span><span><span class="ty">${esc(h.type)}</span>${esc(h.name)} · ${esc(h.note)}</span><span class="num">${won(h.amt)}</span></div>`).join('')}` : ''}</div>`;

    /* 5. 통화 기록 (AI 요약 · 자동 등록 일정 · 준법 점검) — calls.js / calendar.js */
    const calls = SAILOG.CALLS.forCustomer(id);
    const callCard = `<div class="dt-card span" id="dt-callcard" data-cust="${id}">${CAL.callCardInner(id)}</div>`;

    /* 6. 접촉 이력 */
    const contact = contactHTML(c, calls);

    const reco = window.SAILOG_RECO ? SAILOG_RECO.html(c) : ''; // reco.js: 세미나·상품 개인화 제안
    const fund = window.SAILOG_FUND ? SAILOG_FUND.html(c) : ''; // fund.js: AI 펀드 매칭
    $('#dt-grid').innerHTML = hero + account + style + credit + reco + fund + holdings + logs + callCard + contact;
    show('detail');
    drawBalance(c, state.balRange || 90);
  }

  /* ---------- 접촉 이력 카드 (알림톡 · 펀드 안내 알림톡 · 통화) ---------- */
  function contactHTML(c, calls) {
    const id = c.id;
    const contacts = [...state.sent.filter(s => s.id === id).map(s => ({ date: 'today', template: s.tpl, status: '발송됨' })), ...c.history];
    const funds = window.SAILOG_FUND && SAILOG_FUND.sentLog ? SAILOG_FUND.sentLog(id) : [];
    return `<div class="dt-card span" id="dt-contact"><h3>접촉 이력 <span>마지막 연락 ${fmtDate(c.last)} · ${sinceLabel(c.last)}</span></h3>
      ${funds.map(s => `<div class="hist"><span class="d">${fmtDate(s.at)}</span><span>카카오 메시지(광고) · 펀드 정보 안내 · ${esc(s.name)}</span><span class="pill ok st">발송됨</span></div>`).join('')}
      ${contacts.map(h => `<div class="hist"><span class="d">${h.date === 'today' ? '오늘' : fmtDate(h.date)}</span><span>알림톡 · ${esc(TEMPLATES[h.template].name)}</span><span class="pill ${h.status === '읽음' || h.status === '발송됨' ? 'ok' : ''} st">${h.status}</span></div>`).join('')}
      ${calls.map(r => `<div class="hist" data-call="${r.id}" style="cursor:pointer"><span class="d">${fmtDate(r.date)}</span><span>통화 (${r.dir}) · ${esc(r.topics.slice(0, 2).join(' · ') || '상담')}</span><span class="pill ${r.flags.length ? 'pri-3' : ''} st">${r.flags.length ? '준법 주의' : '완료'}</span></div>`).join('')}</div>`;
  }
  addEventListener('sailog:fundsent', (e) => {
    const el = $('#dt-contact'); if (!el || state.detail !== e.detail.id) return;
    el.outerHTML = contactHTML(byId(e.detail.id), SAILOG.CALLS.forCustomer(e.detail.id));
  });

  /* ---------- 상세 상단 한 줄 소개: 등록 정보(누구·어디서 만났나) + 거래 로그 분석(어떻게 투자하나) ---------- */
  function introHTML(c) {
    const it = c.intake, p = c.profile;
    const sec = p.sectors[0] ? p.sectors[0].sector : null;
    const how = p.freq >= 8 ? '단기 매매하는' : p.freq >= 4 ? '몇 주 단위로 사고파는' : '오래 들고 가는';
    const rk = { '공격투자형': '공격', '적극투자형': '적극', '위험중립형': '중립', '안정추구형': '안정추구', '안정형': '안정' }[c.risk] || c.risk;
    const trait = `${sec ? `<b>${esc(sec)}</b> 중심으로 ` : ''}${how} <b>${esc(rk)} 성향</b>`;
    if (!it) return `<p>${trait}이에요.</p><div class="meta"><span>거래 로그 분석</span><span class="miss">직업 · 만난 경로가 등록되지 않았어요</span></div>`;
    const yrs = it.since ? TODAY.getFullYear() - it.since + 1 : null;
    const who = `${it.since ? it.since + (it.origin ? '년 ' + esc(it.origin) : '년부터 거래해 온') + ' ' : ''}${yrs ? yrs + '년차 ' : ''}<b>${esc(it.job)}</b> 고객`;
    return `<p>${who}으로, ${trait}이에요.</p><div class="meta">${it.memo ? `<span>메모 · ${esc(it.memo)}</span>` : ''}<span>${esc(it.src)} + 거래 로그 분석</span></div>`;
  }

  /* ---------- 계좌 잔고 흐름: 꺾은선 + 입출금 표시 (가상 데이터) ---------- */
  const shortWon = (n) => {
    const a = Math.abs(n), s = n < 0 ? '-' : '';
    if (a >= 100000000) return s + (a / 100000000).toFixed(a >= 1e9 ? 0 : 1).replace(/\.0$/, '') + '억';
    if (a >= 10000) return s + Math.round(a / 10000).toLocaleString() + '만';
    return s + Math.round(a).toLocaleString();
  };
  function drawBalance(c, days) {
    const box = $('#dt-bal'); if (!box || !c.balance) return;
    state.balRange = days;
    const pts = c.balance.slice(-(days + 1));
    const first = pts[0].v, last = pts[pts.length - 1].v;
    const net = pts.slice(1).reduce((a, p) => a + p.flow, 0);
    const perf = last - first - net;
    const sg = (n) => (n >= 0 ? '+' : '') + won(n);
    box.innerHTML = `<div class="bal-top">
        <div class="bal-sum"><span>잔고 변화<b class="num">${sg(last - first)}</b></span><span>순입출금<b class="num">${sg(net)}</b></span><span>운용 손익<b class="num ${perf >= 0 ? 'up' : 'down'}">${sg(perf)}</b></span></div>
        <div class="bal-range" role="group" aria-label="기간">${[[30, '1개월'], [90, '3개월'], [180, '6개월']].map(([d, l]) => `<button data-d="${d}" class="${d === days ? 'on' : ''}">${l}</button>`).join('')}</div></div>
      <div class="bal-plot"><svg role="img" aria-label="최근 ${days}일 계좌 잔고 흐름, ${won(first)}에서 ${won(last)}"></svg><div class="bal-tip"></div></div>
      <div class="bal-legend"><span><i style="color:var(--up)">▲</i>입금</span><span><i style="color:var(--down)">▼</i>출금</span><span>운용 손익 = 잔고 변화 − 순입출금</span></div>`;
    box.querySelectorAll('.bal-range button').forEach(b => b.onclick = () => drawBalance(c, +b.dataset.d));

    const plot = box.querySelector('.bal-plot'), svg = plot.querySelector('svg'), tip = plot.querySelector('.bal-tip');
    const W = plot.clientWidth, H = plot.clientHeight, L = 52, R = 10, T = 12, B = 24;
    const vs = pts.map(p => p.v);
    let lo = Math.min(...vs), hi = Math.max(...vs);
    const pad = (hi - lo) * 0.12 || hi * 0.05; lo = Math.max(0, lo - pad); hi += pad;
    const x = i => L + (W - L - R) * i / (pts.length - 1);
    const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    const raw = (hi - lo) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
    const ticks = []; for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push(v);
    const tickLbl = (v) => step >= 1e8 || v < 1e8 ? shortWon(v) : (v / 1e8).toFixed(Math.max(0, Math.min(4, 8 - Math.floor(Math.log10(step))))).replace(/0+$/, '').replace(/\.$/, '') + '억';
    const grid = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text class="ax" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${tickLbl(v)}</text>`).join('');
    const xt = pts.map((p, i) => ({ p, i })).filter(({ p, i }) => days > 30 ? p.d.slice(8) === '01' : i % 7 === (pts.length - 1) % 7)
      .map(({ p, i }) => `<text class="ax" x="${x(i)}" y="${H - 6}" text-anchor="middle">${days > 30 ? +p.d.slice(5, 7) + '월' : +p.d.slice(5, 7) + '.' + +p.d.slice(8)}</text>`).join('');
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
    const area = `${line}L${x(pts.length - 1)},${H - B}L${L},${H - B}Z`;
    const tri = (cx, cy, up) => up ? `M${cx},${cy - 6}L${cx + 5.5},${cy + 4}L${cx - 5.5},${cy + 4}Z` : `M${cx},${cy + 6}L${cx + 5.5},${cy - 4}L${cx - 5.5},${cy - 4}Z`;
    const marks = pts.map((p, i) => p.flow ? `<path d="${tri(x(i), y(p.v) + (p.flow > 0 ? -10 : 10), p.flow > 0)}" fill="${p.flow > 0 ? 'var(--up)' : 'var(--down)'}" stroke="var(--surface)" stroke-width="2"/>` : '').join('');
    svg.innerHTML = `<defs><linearGradient id="bal-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--fg)" stop-opacity=".08"/><stop offset="1" stop-color="var(--fg)" stop-opacity="0"/></linearGradient></defs>
      ${grid}${xt}<path d="${area}" fill="url(#bal-g)"/><path d="${line}" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${marks}
      <circle cx="${x(pts.length - 1)}" cy="${y(last)}" r="4" fill="var(--fg)" stroke="var(--surface)" stroke-width="2"/>
      <g class="hv" style="display:none"><line y1="${T}" y2="${H - B}" stroke="var(--fg3)" stroke-width="1" stroke-dasharray="3 3"/><circle r="5" fill="var(--surface)" stroke="var(--fg)" stroke-width="2"/></g>
      <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/>`;
    const hv = svg.querySelector('.hv'), hit = svg.querySelector('rect');
    hit.onpointermove = (e) => {
      const rc = svg.getBoundingClientRect();
      const i = Math.max(0, Math.min(pts.length - 1, Math.round((e.clientX - rc.left - L) / (W - L - R) * (pts.length - 1))));
      const p = pts[i], px = x(i), py = y(p.v);
      hv.style.display = ''; hv.querySelector('line').setAttribute('x1', px); hv.querySelector('line').setAttribute('x2', px);
      hv.querySelector('circle').setAttribute('cx', px); hv.querySelector('circle').setAttribute('cy', py);
      tip.innerHTML = `${fmtDate(p.d)}<br><b>${won(p.v)}</b>${p.flows.map(f => `<span class="fl">${f.amount > 0 ? '▲ 입금' : '▼ 출금'} ${won(Math.abs(f.amount))} · ${esc(f.desc)}</span>`).join('')}`;
      tip.style.opacity = 1;
      const tw = tip.offsetWidth; tip.style.left = Math.max(0, Math.min(W - tw, px - tw / 2)) + 'px';
      tip.style.top = Math.max(-8, py - tip.offsetHeight - 14) + 'px';
    };
    hit.onpointerleave = () => { hv.style.display = 'none'; tip.style.opacity = 0; };
  }
  addEventListener('resize', () => { if (state.detail && !$('#view-detail').hidden) drawBalance(byId(state.detail), state.balRange || 90); });

  /* ---------- 통화 (시연) ----------
     통화 중: 스크립트 + 실시간 전사(STT 시연, 대본 자동 재생 + PB 직접 입력) + 준법 표현 즉시 감지
     통화 종료: 요약 생성 → 후속 일정 캘린더 자동 등록 → 준법 점검 결과 → 통화 기록 저장 */
  let callTimer, sttTimer;
  const CALLS = SAILOG.CALLS;
  function startCall(id) {
    const c = byId(id); const demo = CALLS.demoFor(c); const lines = []; let sec = 0; let flagged = 0;
    openModal(`<div class="call wide">
      <div class="call-top"><div class="avatar lg">${c.initial}</div><div><div class="d-name">${esc(c.name)} 고객님</div><div class="d-meta">${c.phone} · 시연 환경에서는 실제로 연결되지 않아요</div></div><div class="timer num" id="call-timer">00:00</div></div>
      <div class="call-grid">
        <div class="call-scripts"><div class="lbl-row">전화 스크립트 (AI 초안)</div>
          ${c.signals.length ? c.signals.map((s, i) => `<div class="script" style="margin-bottom:8px"><div class="lbl">${i === 0 ? '오프닝 · ' : ''}${esc(s.label)}</div>${esc(s.script)}</div>`).join('') : '<div class="script">오늘은 특별한 신호가 없어요. 안부 확인과 관심사 청취 위주로 진행하세요.</div>'}</div>
        <div class="stt"><div class="stt-head"><b>실시간 전사</b><span class="pill ok">STT 시연</span><span class="pill" id="stt-guard">◉ 준법 감시 중</span></div>
          <div class="stt-lines" id="stt-lines"><div class="muted" style="font-size:12px;padding:6px 2px">통화가 연결되면 대화가 여기에 전사돼요…</div></div>
          <div id="stt-alert"></div>
          <form class="stt-form" id="stt-form"><input id="stt-input" placeholder="PB 발화 직접 입력 · 감지 테스트: 원금은 제가 보장해 드릴게요" autocomplete="off"><button class="btn sm dark" type="submit">PB 발화 추가</button></form></div>
      </div>
      <div class="call-actions"><button class="btn lg block" id="call-cancel">취소 (기록 안 함)</button><button class="btn lg block primary" id="call-end">통화 종료 · 요약 생성</button></div></div>`, '통화 중', 'wide');
    clearInterval(callTimer); clearInterval(sttTimer);
    callTimer = setInterval(() => { sec++; const el = $('#call-timer'); if (el) el.textContent = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`; }, 1000);

    const renderLines = () => { const el = $('#stt-lines'); if (!el) return; el.innerHTML = lines.map((l, i) => `<div class="stt-line ${l.who === 'PB' ? 'pb' : 'cu'} ${l.flags ? 'flagged' : ''}"><span class="who">${l.who}</span><span>${l.html}</span></div>`).join('') + '<div class="stt-listen"><i></i><i></i><i></i> 듣는 중</div>'; el.scrollTop = el.scrollHeight; };
    const addLine = (who, text) => {
      const l = { who, text, html: esc(text), flags: null };
      if (who === 'PB') { const f = CALLS.checkLine(text); if (f.length) { l.flags = f; f.forEach(x => x.phrases.forEach(p => { l.html = l.html.split(esc(p)).join(`<mark class="flag-mark sev${x.sev}">${esc(p)}</mark>`); })); flagged += f.length; showAlert(f, text); } }
      lines.push(l); renderLines();
    };
    const showAlert = (f, text) => {
      const g = $('#stt-guard'); if (g) { g.textContent = `⚠ 주의 표현 ${flagged}건`; g.className = 'pill pri-3'; }
      const el = $('#stt-alert'); if (!el) return;
      el.innerHTML = f.map(x => `<div class="flag-banner sev${x.sev}"><div class="flag-top"><b>⚠ 준법 주의 · ${esc(x.label)}</b><span class="muted">${esc(x.law)}</span></div><div class="flag-q">“${x.phrases.map(esc).join('”, “')}”</div><div class="flag-fix">${esc(x.fix)}</div></div>`).join('');
      el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    };
    let i = 0;
    const playNext = () => { if (i >= demo.length) { clearInterval(sttTimer); const l = $('.stt-listen'); if (l) l.textContent = '대화가 끝났어요. 통화 종료를 눌러 요약을 만들어 주세요.'; return; } addLine(demo[i].who, demo[i].text); i++; };
    setTimeout(playNext, 600); sttTimer = setInterval(playNext, 2200);
    $('#stt-form').onsubmit = (e) => { e.preventDefault(); const v = $('#stt-input').value.trim(); if (!v) return; addLine('PB', v); $('#stt-input').value = ''; };
    $('#call-cancel').onclick = closeModal;
    $('#call-end').onclick = () => {
      clearInterval(sttTimer); clearInterval(callTimer);
      while (i < demo.length) { addLine(demo[i].who, demo[i].text); i++; } // 남은 대본은 요약에 포함
      const rec = CALLS.record(c, lines.map(l => ({ who: l.who, text: l.text })), Math.max(sec, demo.length * 12), '발신');
      closeModal(); CAL.openCall(rec.id, { fresh: true });
      if (window.SAILOG_LIVE) SAILOG_LIVE.onCall(rec);   // live.js: 시연 모드 기록 (고객에게는 보내지 않음)
      const n = rec.schedule.filter(s => !(s.date === rec.date && s.kind === 'doc')).length;
      if (rec.flags.length) UI.toast(`⚠ 준법 주의 표현 ${rec.flags.length}건 감지 · 고객 상세 통화 기록에서 확인하세요`, '상세 보기', () => { closeModal(); openDetail(id); });
      else UI.toast(n ? `통화 요약 저장 · 일정 ${n}건을 캘린더에 등록했어요` : '통화 요약을 저장했어요');
      renderTodo(); if (state.selected === id) openDrawer(id, true); if (state.view === 'detail' && state.detail === id) openDetail(id);
      if (state.view === 'calendar') CAL.render();
    };
  }

  /* ---------- 모달 ---------- */
  function openModal(inner, title, size) {
    $('#modal-root').innerHTML = `<div class="modal"><div class="modal-card" style="${size === 'narrow' ? 'max-width:560px' : size === 'wide' ? 'max-width:1040px' : ''}"><div class="modal-head"><h3>${esc(title)}</h3><button class="x" aria-label="닫기">×</button></div><div class="modal-body">${inner}</div></div></div>`;
    $('#scrim').classList.add('on');
    $('#modal-root .x').onclick = closeModal;
  }
  function closeModal() { clearInterval(callTimer); clearInterval(sttTimer); CAL.clearModal(); $('#modal-root').innerHTML = ''; if (!$('#drawer').classList.contains('open') || window.innerWidth > 1100) $('#scrim').classList.remove('on'); }

  /* ---------- 알림톡 발송 모달 (고객 1명) ---------- */
  function openSendModal(id, tplKey) {
    const c = byId(id);
    const options = [...new Set(c.signals.filter(s => s.template).map(s => s.template))];
    let tpl = tplKey && options.includes(tplKey) ? tplKey : options[0];
    const render = () => {
      openModal(`<div class="send-layout"><div>
        <h4 style="font-size:13px;color:var(--fg3);margin-bottom:10px">${esc(c.name)} 고객님에게 보낼 템플릿</h4>
        <div class="tpl-select">${options.map(k => `<button class="tpl-opt ${k === tpl ? 'active' : ''}" data-k="${k}"><span class="em">${TEMPLATES[k].emoji}</span><div><b>${esc(TEMPLATES[k].name)}</b><span>오늘 신호에서 자동 추천</span></div></button>`).join('')}</div>
        <p class="muted" style="font-size:12px;margin:14px 0 10px;line-height:1.5">내용은 고객 계좌 로그를 바탕으로 자동 생성됩니다. 발송 전 미리보기를 확인하세요. 투자 권유 표현은 포함되지 않습니다.</p>
        <button class="btn primary lg block" id="send-one">알림톡 발송 (시연)</button>
      </div><div>${UI.phoneHTML(UI.alimtalkHTML(c, tpl))}</div></div>`, '알림톡 보내기');
      document.querySelectorAll('.tpl-opt').forEach(b => b.onclick = () => { tpl = b.dataset.k; render(); });
      $('#send-one').onclick = () => { send([id], tpl); closeModal(); };
    };
    render();
  }
  function send(ids, tpl) {
    ids.forEach(id => state.sent.push({ id, tpl, at: Date.now() }));
    UI.toast(`${ids.length === 1 ? byId(ids[0]).name + ' 고객에게' : ids.length + '명에게'} '${TEMPLATES[tpl].name}' 알림톡을 보냈어요 (시연)`);
    if (window.SAILOG_LIVE) SAILOG_LIVE.onSend(ids, tpl);   // live.js: 시연 모드면 고객 폰에 도착
    if (state.selected) openDrawer(state.selected, true);
    if (state.view === 'send') renderSend();
  }

  /* ---------- 고객 목록 ---------- */
  function renderCustomers() {
    const q = $('#q').value.trim(); const risk = $('#risk-filter').value; const sort = $('#sort-filter').value;
    const base = CUSTOMERS.filter(c => (!q || c.name.includes(q)) && (!risk || c.risk === risk));
    let rows = base.filter(SAILOG_CF.match);   // 빠른 보기 · 기능별 필터 (custfilter.js)
    rows.sort((a, b) => sort === 'total' ? b.total - a.total : sort === 'day' ? b.dayPnl - a.dayPnl : sort === 'last' ? a.last.localeCompare(b.last) : (b.pri - a.pri || b.total - a.total));
    $('#cust-count').textContent = `${rows.length}명`;
    $('#cust-rows').innerHTML = rows.map(c => `<tr data-id="${c.id}">
      <td><b>${esc(c.name)}</b><div class="muted" style="font-size:11px">${c.age}세</div></td>
      <td>${c.risk}</td>
      <td>${c.profile.sectors.slice(0, 2).map(s => `<span class="chip">${esc(s.sector)}</span>`).join(' ')}</td>
      <td class="r num">${won(c.total)}</td>
      <td class="r num">${won(c.cash)}${c.idle >= 30 ? `<div class="muted" style="font-size:11px">${c.idle}일 미운용</div>` : ''}</td>
      <td class="r num ${c.dayPnl >= 0 ? 'up' : 'down'}">${won(c.dayPnl)}</td>
      <td>${c.signals.length ? `<span class="sig-dots">${c.signals.map(s => `<i class="p${s.pri}"></i>`).join('')}</span> ${state.done.has(c.id) ? '<span class="pill ok">완료</span>' : esc(c.signals[0].label)}` : '<span class="muted">-</span>'}</td>
      <td class="${-dayDiff(c.last) > 60 ? 'down' : ''}">${sinceLabel(c.last)}</td></tr>`).join('');
    document.querySelectorAll('#cust-rows tr').forEach(r => r.onclick = () => openDetail(Number(r.dataset.id)));
    SAILOG_CF.render(base, rows);
  }
  ['#risk-filter', '#sort-filter'].forEach(s => $(s).onchange = renderCustomers);
  SAILOG_CF.init({ sent: () => state.sent, done: () => state.done, onChange: renderCustomers,
    sendBulk: (ids, tpl) => { state.tpl = tpl; state.recip = new Set(ids); show('send'); } });
  $('#q').addEventListener('input', () => {
    if (state.view === 'calendar') return CAL.setQuery();   // 일정 화면: 탭 이동 없이 해당 고객 일정만 남김 (calendar.js)
    if (state.view !== 'customers') show('customers'); else renderCustomers();
  });

  /* ---------- 알림톡 발송 화면 ---------- */
  function renderSend() {
    const keys = Object.keys(TEMPLATES);
    const recommended = (k) => CUSTOMERS.filter(c => c.signals.some(s => s.template === k));
    $('#tpl-list').innerHTML = keys.map(k => `<button class="tpl ${state.tpl === k ? 'active' : ''}" data-k="${k}"><div class="em">${TEMPLATES[k].emoji}</div><b>${esc(TEMPLATES[k].name)}</b><span>추천 대상 ${recommended(k).length}명 · ${TEMPLATES[k].cat}</span></button>`).join('');
    document.querySelectorAll('.tpl').forEach(b => b.onclick = () => { state.tpl = b.dataset.k; state.recip = new Set(); renderSend(); });
    const list = recommended(state.tpl);
    if (!state.recip.size && list.length) state.recip.add(list[0].id);
    const first = list.find(c => state.recip.has(c.id)) || list[0];
    $('#recip-title').textContent = '추천 대상';
    $('#recip-sub').textContent = `${list.length}명 · ${state.recip.size}명 선택`;
    $('#recip-list').innerHTML = list.map(c => { const sentToday = state.sent.some(s => s.id === c.id && s.tpl === state.tpl); const sig = c.signals.find(s => s.template === state.tpl); return `<label class="recip-item ${first && first.id === c.id ? 'active' : ''}" data-id="${c.id}"><input type="checkbox" ${state.recip.has(c.id) ? 'checked' : ''}><div class="avatar" style="width:32px;height:32px;font-size:13px">${c.initial}</div><div><b>${esc(c.name)}</b><div class="meta">${sig ? esc(sig.title) : c.risk + ' · ' + won(c.total)}</div></div>${sentToday ? '<span class="pill ok sent-tag">오늘 발송</span>' : ''}</label>`; }).join('') || '<div class="muted" style="font-size:13px;padding:10px">이 템플릿에 해당하는 고객이 없어요.</div>';
    document.querySelectorAll('.recip-item').forEach(el => {
      const id = Number(el.dataset.id);
      $('input', el).onchange = (e) => { e.target.checked ? state.recip.add(id) : state.recip.delete(id); $('#recip-sub').textContent = `${list.length}명 · ${state.recip.size}명 선택`; };
      el.onclick = (e) => { if (e.target.tagName === 'INPUT') return; document.querySelectorAll('.recip-item').forEach(x => x.classList.remove('active')); el.classList.add('active'); $('#send-preview').innerHTML = UI.phoneHTML(UI.alimtalkHTML(byId(id), state.tpl)); };
    });
    $('#send-preview').innerHTML = first ? UI.phoneHTML(UI.alimtalkHTML(first, state.tpl)) : '';
    $('#send-all').onclick = () => { if (!state.recip.size) return UI.toast('발송할 고객을 선택해 주세요'); send([...state.recip], state.tpl); };
  }

  /* ---------- 인사이트 ---------- */
  function renderInsight() {
    const totalAUM = CUSTOMERS.reduce((a, c) => a + c.total, 0);
    const idleCash = CUSTOMERS.filter(c => c.idle >= 30).reduce((a, c) => a + c.cash, 0);
    $('#ins-stats').innerHTML = [['관리 고객', CUSTOMERS.length + '명'], ['관리 자산', won(totalAUM)], ['30일+ 미운용 예수금', won(idleCash), 'brand'], ['오늘 발송한 알림톡', state.sent.length + '건']].map(([k, v, c]) => `<div class="stat"><span>${k}</span><b class="${c || ''}">${v}</b></div>`).join('');
    const bars = (el, pairs) => { const max = Math.max(...pairs.map(p => p[1]), 1); $(el).innerHTML = pairs.map(([k, v]) => `<div class="bar-row"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${v / max * 100}%"></div></div><span class="v num">${v}명</span></div>`).join(''); };
    const sec = {}; CUSTOMERS.forEach(c => c.profile.sectors.slice(0, 2).forEach(s => { sec[s.sector] = (sec[s.sector] || 0) + 1; }));
    bars('#ins-sectors', Object.entries(sec).sort((a, b) => b[1] - a[1]).slice(0, 8));
    const risk = {}; CUSTOMERS.forEach(c => { risk[c.risk] = (risk[c.risk] || 0) + 1; });
    bars('#ins-risk', ['안정형', '안정추구형', '위험중립형', '적극투자형', '공격투자형'].map(k => [k, risk[k] || 0]));
    const sig = {}; TODOS.forEach(t => t.signals.forEach(s => { sig[s.label] = (sig[s.label] || 0) + 1; }));
    bars('#ins-signals', Object.entries(sig).sort((a, b) => b[1] - a[1]));
    const moves = {}; CUSTOMERS.forEach(c => c.holdings.forEach(h => { if (Math.abs(h.chg) >= 5) { moves[h.key] = moves[h.key] || { h, n: 0, pnl: 0, who: [] }; moves[h.key].n++; moves[h.key].pnl += h.value * (h.chg / 100) / (1 + h.chg / 100); moves[h.key].who.push(c.name); } }));
    $('#ins-moves').innerHTML = Object.values(moves).sort((a, b) => Math.abs(b.h.chg) - Math.abs(a.h.chg)).map(m => `<div class="mv"><div><b>${esc(m.h.name)}</b> <span class="num ${m.h.chg >= 0 ? 'up' : 'down'}">${pct(m.h.chg)}</span><div class="who">${m.who.join(', ')}</div></div><div class="num" style="text-align:right"><b>${m.n}명</b><div class="who">보유</div></div><div class="num ${m.pnl >= 0 ? 'up' : 'down'}" style="text-align:right"><b>${won(m.pnl)}</b><div class="who">오늘 손익 합계</div></div></div>`).join('');
  }

  CAL.init({ openModal, closeModal, openDrawer, openDetail: (cid) => { closeModal(); openDetail(cid); }, show, toast: UI.toast, complete: (cid) => { closeDrawer(); complete(cid, document.querySelector(`.task[data-id="${cid}"]`)); } });
  SAILOG_CX.init({ show });
  SAILOG_LIVE.init({ toast: UI.toast, undo, call: startCall, refreshCal: () => (state.view === 'calendar' ? CAL.render() : CAL.refreshBadges()),
    isOpen: (cid) => TODOS.some(t => t.id === cid) && !state.done.has(cid),
    markDone: (cid) => { state.done.add(cid); persist(); renderTodo(); } });   // live.js: 고객이 처리하면 오늘 할 일 완료 (드로어는 열지 않음)
  renderTodo();

  /* 딥링크: #view=send|calendar | #c=12 (고객 드로어) | #d=2 (고객 상세 페이지) | #call=2 | #send=3 */
  const h = new URLSearchParams(location.hash.slice(1) || window.__SAILOG_HASH || '');   // __SAILOG_HASH: 한 파일 버전(dist)에서 주입
  if (h.get('view') && h.get('view') !== 'detail') show(h.get('view'));
  if (h.get('d')) openDetail(Number(h.get('d')));
  if (h.get('c')) openDrawer(Number(h.get('c')));
  if (h.get('call')) startCall(Number(h.get('call')));
  if (h.get('send')) openSendModal(Number(h.get('send')));
  if (h.get('callview')) CAL.openCall(h.get('callview')); // 통화 요약 모달 (예: #callview=c-1016)
})();
</script>
<script>
/* 소개 페이지(고객 편 · PB 편)에서 넘어오면 이전 스크롤 위치가 이어지지 않고 맨 위에서 시작 */
(() => {
  try { history.scrollRestoration = 'manual'; } catch (e) {}
  const top = () => window.scrollTo(0, 0);
  top(); addEventListener('load', () => { top(); setTimeout(top, 60); });
})();
</script>
</body>
</html>
